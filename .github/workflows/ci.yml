      - extracted-tests
      - flake-check-aarch64-darwin
      - flake-check-x86_64-linux
      - lint
      - md-examples
      - nix-build-aarch64-darwin
      - nix-build-android
      - nix-build-x86_64-linux
      - sanitize-1
      - sanitize-2
      - sanitize-3
      - sanitize-4
      - shader-readback
      - shader-reproducibility
      - spec-evidence
      - test-aarch64-darwin-ldc2-1
      - test-aarch64-darwin-ldc2-2
      - test-aarch64-darwin-ldc2-3
      - test-aarch64-linux-ldc2-1
      - test-aarch64-linux-ldc2-2
      - test-aarch64-linux-ldc2-3
      - test-aarch64-linux-ldc2-4
