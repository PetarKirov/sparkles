# TEMPORARY — iteration CI for the base.sync pull request; drop this commit
# before it merges. It runs only the work that bears on base.sync: base's
# suite, the portable parker on every platform, and the sync, FreeBSD and
# spec-evidence jobs, which are copied unchanged from the full workflow.
name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: base (${{ matrix.system }}, ${{ matrix.DC }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, system: x86_64-linux, DC: ldc2 }
          - { runner: ubuntu-latest, system: x86_64-linux, DC: dmd }
          - { runner: macos-latest, system: aarch64-darwin, DC: ldc2 }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux, DC: ldc2 }
          - { runner: windows-latest, system: x86_64-windows, DC: ldc2 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Nix
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci
          use-nix-cache: true
          nix-cache-key: nix-v2-${{ matrix.system }}-${{ matrix.DC }}-${{ hashFiles('**/flake.lock') }}
          nix-cache-restore-prefixes: |
            nix-v2-${{ matrix.system }}-${{ matrix.DC }}-
            nix-v2-${{ matrix.system }}-

      - name: Install D (LDC)
        if: runner.os == 'Windows'
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0

      - name: Cache DUB packages
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
          key: ${{ matrix.system }}-dub-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            ${{ matrix.system }}-dub-

      - name: Cache DUB packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/dub
          key: ${{ matrix.system }}-dub-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            ${{ matrix.system }}-dub-

      - name: Test base
        if: runner.os != 'Windows'
        run: |
          dub test :base --compiler="$DC" -- -t 1
          dub test :base --compiler="$DC"
        env:
          DC: ${{ matrix.DC }}

      - name: Test base (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ci/test-windows.sh base
        env:
          DC: ${{ matrix.DC }}

      - name: base.sync with the portable parker
        shell: bash
        run: dub test :base --compiler=${{ matrix.DC }} -c unittest-portable -- -i 'sync\.'

      - name: base.sync litmus tests
        if: runner.arch == 'ARM64'
        run: dub run --single --temp-build libs/base/tools/check-sync-litmus.d

  # sparkles.base.sync's evidence that no other job produces
  # (docs/specs/base/sync/testing.md): the portable thread parker on a leg
  # with a native seam (oracle 5, DS24), and the TLA+ protocol model
  # (oracle 10).
  sync:
    name: base.sync portable parker and protocol model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci
          use-nix-cache: true
          nix-cache-key: nix-v2-x86_64-linux-sync-${{ hashFiles('**/flake.lock') }}
          nix-cache-restore-prefixes: |
            nix-v2-x86_64-linux-sync-
            nix-v2-x86_64-linux-

      - name: base.sync with the portable parker
        run: dub test :base -c unittest-portable -- -i 'sync\.'

      - name: TLA+ protocol model
        run: nix shell --inputs-from . nixpkgs#tlaplus18 nixpkgs#jdk21_headless --command sh libs/base/tla/sync/check.sh

      # Oracle 9's x86-64 control: the real primitives show no stale read.
      - name: base.sync litmus tests
        run: dub run --single --temp-build libs/base/tools/check-sync-litmus.d

      # Oracle 11: the uncontended lock and unlock compile to one atomic
      # read–modify–write and no call, on x86-64 and arm64.
      - name: base.sync fast-path disassembly
        run: dub run --single --temp-build libs/base/tools/check-sync-fast-path.d

      # Oracle 4: native stress under ThreadSanitizer reports nothing, and
      # every seeded fault (a relaxed release) is reported.
      - name: base.sync under ThreadSanitizer
        run: dub run --single --temp-build libs/base/tools/check-sync-tsan.d

  # The `_umtx_op` seam has no hosted runner: a FreeBSD virtual machine runs
  # base.sync's suite on every pull request, within 15 minutes (DS24; past
  # that, it moves to a nightly and on-demand schedule).
  freebsd:
    name: FreeBSD (base.sync)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: base.sync in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          usesh: true
          prepare: pkg install -y ldc dub git
          run: dub test :base --compiler=ldc2 -- -i 'sync\.'

  # Every symbol a spec's evidence column cites must exist in the tree. The
  # pre-commit hook of the same name runs it too (and so does `lint`, through
  # `prek run --all-files`), but a hook can be skipped and a lint failure
  # reads as formatting. This is the gate, named for what it checks. The
  # backlog it started with (`docs/specs/evidence-backlog.txt`) is empty, so
  # any unresolved citation fails here.
  #
  # `.#ci-minimal`, not `.#ci`: the check only reads files and runs `git
  # ls-files`, so the toolchain in `.#ci`'s closure would be 2.4 GiB of
  # nothing. For the same reason no `/nix` cache is restored.
  spec-evidence:
    name: Spec evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          use-nix-cache: false

      - name: Every cited symbol resolves
        run: nix run .#ci-minimal -- --check-spec-evidence

      # Same shape of check, same job: it reads the credits document and the
      # build inputs, nothing more (docs/specs/terminal/pages.md TPG14).
      - name: Every shipped component is credited
        run: nix run .#ci-minimal -- --check-credits

  ci:
    name: CI
    needs: [test, sync, freebsd, spec-evidence]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded or was skipped
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$r'"; exit 1 ;;
            esac
          done
