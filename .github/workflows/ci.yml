# Generated from nix/ci/workflows/ci.nix — do not edit by hand.
# Regenerate with `nix run .#render-workflows` (also a pre-commit hook).
name: CI
"on":
  merge_group: {}
  pull_request: {}
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      force:
        default: false
        description: "Run every job, ignoring the stamps of earlier passes"
        type: boolean
permissions:
  contents: read
concurrency:
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
  group: "${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}"
jobs:
  ci:
