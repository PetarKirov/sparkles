name: CI

on:
  # Allow this workflow to be triggered manually:
  workflow_dispatch:

  # Allow this workflow to be run in merge queues:
  merge_group:

  # Run this workflow for all PRs:
  pull_request:

  # …and on `main` itself, where only `lint` runs — see the `if:` guards below.
  #
  # This is what populates the *base* cache scope. A `pull_request` run may
  # only read caches written by its own `refs/pull/N/merge` ref, by the base
  # branch, or by the default branch, and it may only *write* to its own ref.
  # Without a run on `refs/heads/main` nothing ever lands in the shared scope,
  # so every PR starts cold and then saves its own private copy of each cache
  # — which is how 13 caches came to occupy 14.64 GB against a 10 GB quota,
  # evicting each other by LRU.
  #
  # Seeding only lychee's cache is the deliberate trade: the `*-dub-*` entries
  # stay per-PR, because warming those would mean running the whole matrix on
  # every merge.
  #
  # That seeding is now a fallback rather than the plan. A cache written once
  # per merge is, by construction, the least-recently-used entry in a repository
  # whose pull requests write caches on every push — so it is always the first
  # thing evicted, and raising the quota moves that threshold without changing
  # the ordering. A pull request therefore no longer depends on it:
  # `lychee-offline` covers the whole tree without the network, and the
  # networked check runs over the diff. The full sweep is the `schedule` below.
  push:
    branches:
      - main

  # The full network link sweep. Rot appears with nobody committing, so it is
  # found on a timer rather than by whichever pull request happens to be open.
  schedule:
    - cron: '17 4 * * *'

# Least privilege by default: no job here writes to the repository. The cachix
# push authenticates with its own token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are worth cancelling; a `main` run is not. It is the
  # only writer of the base-scope cache above, so cancelling it on the next
  # merge would leave every PR cold again.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job below takes its Nix closure straight from Cachix and does NOT
# cache /nix/store in the Actions cache (`use-nix-cache` is left off). That
# cache had become pure cost: the repository's Actions cache is at its budget
# and read-only ("You have reached your configured budget, your cache is now
# read only"), so every restore missed, every job then fetched the closure
# from Cachix anyway, and every job still spent 30 s (test legs) to 136 s
# (`nix-build`) in its post-job step tarring a multi-GB store for a save that
# was refused. Even with the budget lifted the arithmetic is poor: a
# per-system, per-compiler 1.8 GB store cache saved by every PR push is what
# blew the quota in the first place, and a Cachix fetch of `devShells.ci` is
# ~60 s on Linux — about what a restore costs. The DUB caches stay: they are
# small and hold the one thing Cachix cannot serve (dub's build of the
# `dmd:frontend` git dependency, ~1 min per consumer).
#
# The pipeline is shaped for a wall clock of 5–10 min per job. The D test
# suite is sharded across runners (`ci --shard I/N`, cost-balanced and
# deterministic, see apps/ci/src/shard.d) rather than run as one 20–30 min
# job, coverage instrumentation is off (nothing in CI reads the listings, and
# LDC's atomic `-cov` counters made `base`'s parallel leg 17× slower: 84 s
# against 5 s), and the research sweeps that had accreted onto the test job —
# the standalone examples, the X11/Wayland demos, the markdown example
# verification — each run as their own job in parallel with it.

jobs:
  test:
    name: test (${{ matrix.system }}, ${{ matrix.DC }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    # `main` and `schedule` runs exist for the link sweep and the cache it
    # seeds. Everything but `lint` is therefore pull-request-only. Since
    # CircleCI was retired nothing runs the suite post-merge; drop these
    # guards to get that coverage back (see ci/README.md).
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      # `leg × shard`, with `include` attaching the runner/system/compiler
      # and the leg's shard count to each leg by its key (an `include` entry
      # that names an existing `leg` value is merged into every combination
      # carrying it). `shards` is what `--shard I/N` divides by, so a leg
      # with fewer shards than the axis lists drops its surplus in `exclude`.
      #
      # Five for the Linux legs, from the first sharded run's numbers: the
      # suite is ~1600 s of per-package cost on the slowest leg, a runner
      # spends 1–3 min on its Nix fetch before the first `dub` runs (the whole
      # matrix starts at once and shares Cachix's bandwidth), so four shards
      # put the heaviest at 10 min and five put it at ~8. Four for macOS: the
      # hosted plan runs at most five macOS jobs at once, and this workflow
      # has the `examples` shards and `nix-build` on macOS too — a fifth test
      # shard only queued behind the first wave, while a quarter of the
      # macOS suite is ~4 min of `dub` after the fetch.
      matrix:
        leg:
          - x86_64-linux-ldc2
          - x86_64-linux-dmd
          - aarch64-darwin-ldc2
          - aarch64-linux-ldc2
        shard: [1, 2, 3, 4, 5]
        include:
          - leg: x86_64-linux-ldc2
            runner: ubuntu-latest
            system: x86_64-linux
            DC: ldc2
            shards: 5
          - leg: x86_64-linux-dmd
            runner: ubuntu-latest
            system: x86_64-linux
            DC: dmd
            shards: 5
          - leg: aarch64-darwin-ldc2
            runner: macos-latest
            system: aarch64-darwin
            DC: ldc2
            shards: 4
          # The one host where `real` is binary128 (`real.mant_dig == 113`):
          # the leg that compiles and runs the wide-format conversion paths
          # natively. That makes `base` its outlier (its float sweeps run 3×
          # slower than on x86 under `-cov`; a third of `hue` without it).
          - leg: aarch64-linux-ldc2
            runner: ubuntu-24.04-arm
            system: aarch64-linux
            DC: ldc2
            shards: 5
        exclude:
          - leg: aarch64-darwin-ldc2
            shard: 5
    runs-on: ${{ matrix.runner }}
    # A shard is 4–7 min warm. The cap has to absorb a cold DUB cache — the key
    # is the hash of the dub files, so bumping the `dmd:frontend` pin makes
    # every shard that consumes it pay that build again (~1 min under ldc2,
    # several under dmd) — and the hosted Apple-Silicon runner's occasional
    # stall. A cap that fires mid-step reads as a hang rather than as "out of
    # budget", so it is generous relative to the warm figure, not tight.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      # Keyed by system, not runner.os (that is "Linux" for x86_64 and arm64
      # alike), by compiler (dub hashes the compiler into every build id), and
      # by shard: each shard builds a different subset of the third-party
      # dependencies, and the Actions cache never overwrites an existing key —
      # so one key shared by four shards would freeze at whichever shard saved
      # first and stay partial for the other three.
      #
      # `~/.dub/cache/sparkles` is excluded: dub's build cache for the in-tree
      # packages is keyed by `git describe`, so it holds this commit's builds
      # and nothing a later run can reuse. Without the exclusion every save
      # would carry a stale copy of the whole tree's objects.
      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
            !~/.dub/cache/sparkles
          key: ${{ matrix.system }}-${{ matrix.DC }}-dub-${{ matrix.shard }}-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            ${{ matrix.system }}-${{ matrix.DC }}-dub-${{ matrix.shard }}-
            ${{ matrix.system }}-${{ matrix.DC }}-dub-

      # `--no-coverage`: nothing in CI consumes the `-cov` listings, and the
      # instrumentation is not free — see the note at the top of this file.
      # Coverage stays on by default for a local `ci --test`, where `hue --cov`
      # reads the result.
      - name: Build and test with dub
        run: ci --test --fail-fast --no-coverage --shard ${{ matrix.shard }}/${{ matrix.shards }}
        env:
          # `ci` embeds dmd (small closure); honour the matrix compiler for the
          # test suite so the ldc2/dmd dimensions are actually exercised. Both
          # are on PATH via the `ci` dev shell.
          DC: ${{ matrix.DC }}

  # Native Windows — the host the `sparkles:wsi` Win32 backend had only ever
  # been certified on through Wine. There is no Nix on the hosted runner, so
  # this leg takes its toolchain from setup-dlang and runs the suite through
  # ci/test-windows.sh instead of the `ci` helper (whose closure needs
  # tree-sitter via pkg-config). Which packages it covers, and why the rest are
  # left out, is that script's business. Its own job rather than a `test`
  # matrix leg: it shares no step with the Nix legs, and the 19-package
  # allowlist runs in ~4 min unsharded.
  test-windows:
    name: test (x86_64-windows, ldc2)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Windows leg's toolchain (LDC plus the dub it bundles). Pinned to the
      # flake's LDC so every leg agrees on the compiler; ci/install-ldc-windows.sh
      # carries the same version for CircleCI.
      - name: Install D (LDC)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0

      # dub keeps its package store under %LOCALAPPDATA% on Windows.
      - name: Cache DUB packages (Windows)
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/dub
          key: x86_64-windows-dub-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            x86_64-windows-dub-

      # `ci --test` without the `ci` helper: `dub test` per allowlisted
      # sub-package, `-t 1` then `-t 0`, under Git Bash so the script shares
      # ci/lib/common.sh with CircleCI's bash.exe.
      - name: Build and test with dub (Windows)
        shell: bash
        run: ci/test-windows.sh
        env:
          DC: ldc2

      # The native half of what libs/wsi/scripts/verify-win32-wine.sh certifies
      # under Wine: the shared WSI conformance suite through the Win32 driver,
      # on a real User32 and IOCP. Wine is a compatibility lane, not native
      # evidence — its monitors are fixed at 96 DPI and its modal loops depend
      # on which display driver loaded — which is why the spec's comparison.md
      # carried "native Windows CI" as an owed column. Counts are pinned as in
      # every other lane, so a driver that skipped everything cannot pass. The
      # IMM32 preedit phase is the one thing this host cannot show: the runner's
      # US layout has no IME UI, so the driver sees the result-string commit but
      # no preedit, and says so — the preedit evidence stays with the Wine lane.
      - name: Build & run the sparkles:wsi Win32 conformance driver
        shell: bash
        run: |
          dub run --single --compiler=ldc2 libs/wsi/examples/win32-hosted-smoke.d | tee smoke.log
          grep -q '^ok: Win32 WSI conformance (15 checked, 3 skipped)' smoke.log
          grep -q '^ok: Win32 text commit' smoke.log

      # The Win32 OS-API research example and the per-feature demos: bounded
      # runs via WSI_AUTO_EXIT (the interactive parts are exercised manually /
      # under Wine locally — see the manual-run queue).
      - name: Build & run the Win32 OS-API example and demos
        shell: bash
        env:
          WSI_AUTO_EXIT: 1
        run: |
          base=docs/research/window-system-integration/os-apis
          echo "::group::win32 $base/win32/example"
          dub run --compiler=ldc2 --root="$base/win32/example"
          echo "::endgroup::"
          for d in "$base"/win32/examples/*/; do
            [ -f "$d/dub.sdl" ] || continue
            echo "::group::win32 $d"
            dub run --compiler=ldc2 --root="$d"
            echo "::endgroup::"
          done

  # The standalone example programs (`libs/*/examples/*.d` and the research
  # catalogs' `examples/`), built and run on the hosts that have a Nix
  # toolchain — plus `nix flake check`, which is a flake-evaluation gate rather
  # than a test and only needs to run once per system. Previously the tail of
  # the `test` job; 4–5 min of parallel builds that never depended on the
  # tests, now two shards per host (`leg × shard`, as in `test`) so the
  # macOS leg — 5 min of builds on 3 cores after a 3 min Nix fetch — stays
  # inside the budget.
  examples:
    name: examples (${{ matrix.system }}, ${{ matrix.DC }}, shard ${{ matrix.shard }}/2)
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        leg:
          - x86_64-linux-ldc2
          - x86_64-linux-dmd
          - aarch64-darwin-ldc2
        shard: [1, 2]
        include:
          - leg: x86_64-linux-ldc2
            runner: ubuntu-latest
            system: x86_64-linux
            DC: ldc2
            jobs: 4
          - leg: x86_64-linux-dmd
            runner: ubuntu-latest
            system: x86_64-linux
            DC: dmd
            jobs: 4
          # 3 vCPUs and ~7 GiB: `ci` budgets ~2 GiB per concurrent ldc build,
          # so three is what the host affords.
          - leg: aarch64-darwin-ldc2
            runner: macos-latest
            system: aarch64-darwin
            DC: ldc2
            jobs: 3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
            !~/.dub/cache/sparkles
          key: ${{ matrix.system }}-${{ matrix.DC }}-dub-examples-${{ matrix.shard }}-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            ${{ matrix.system }}-${{ matrix.DC }}-dub-examples-${{ matrix.shard }}-
            ${{ matrix.system }}-${{ matrix.DC }}-dub-examples-

      - name: Run flake checks
        if: matrix.shard == 1
        run: nix flake check

      # `SPARKLES_CI_JOBS` pins the example builder's worker count. Left to
      # itself `ci` derives one from the host's 1-minute load average, which
      # on a runner still reflects the Nix fetch that just finished: the lint
      # job's example verification once ran 140 examples on ONE worker
      # (`workers=1 online=4 load=3.74`) for 16 minutes.
      - name: Build and run examples
        run: ci --example-files --fail-fast --shard ${{ matrix.shard }}/2
        env:
          DC: ${{ matrix.DC }}
          SPARKLES_CI_JOBS: ${{ matrix.jobs }}

  # OS-API research examples (docs/research/.../os-apis). These are multi-file
  # dub packages (ImportC), not single-file, so they are outside `ci
  # --example-files`; build/run the Linux ones here in the devshell. X11 opens a
  # real window under xvfb; Wayland has no compositor in CI so it prints SKIP
  # and exits 0. (macOS/iOS/Android are verified out of band — see the
  # surveys.) A research sweep, so it gets its own job rather than a quarter of
  # the test gate's budget: 41 dub packages built and run under xvfb/weston,
  # ~4m30s.
  wsi-demos:
    name: OS-API windowing examples (X11 + Wayland)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
            !~/.dub/cache/sparkles
          key: x86_64-linux-ldc2-dub-wsi-demos-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            x86_64-linux-ldc2-dub-wsi-demos-

      - name: Build & run OS-API windowing examples (X11 + Wayland)
        run: |
          xvfb-run -a dub run --compiler=ldc2 --root=docs/research/window-system-integration/os-apis/x11/example
          dub run --compiler=ldc2 --root=docs/research/window-system-integration/os-apis/wayland/example
          # Interactive GUI probe — compile only; running it would sit in a
          # window loop until the job timed out.
          dub build --single --compiler=ldc2 \
            docs/research/window-system-integration/cursor-shapes/cursor-shapes.d

      # Per-feature windowing demos (os-apis/<platform>/examples/{scaffold,fXX-*}).
      # Demos exit after a bounded run when WSI_AUTO_EXIT=1 and print `SKIP:` +
      # exit 0 when a host capability is missing — a missing capability must never
      # red the build. X11 demos run under Xvfb; Wayland demos under a headless
      # weston instance.
      - name: Build & run OS-API windowing demos (X11 + Wayland)
        env:
          WSI_AUTO_EXIT: 1
        run: |
          base=docs/research/window-system-integration/os-apis
          for d in "$base"/x11/examples/*/; do
            [ -f "$d/dub.sdl" ] || continue
            echo "::group::x11 $d"
            xvfb-run -a dub run --compiler=ldc2 --root="$d"
            echo "::endgroup::"
          done
          if ls -d "$base"/wayland/examples/*/ >/dev/null 2>&1; then
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            weston --backend=headless --socket=wsi-ci --idle-time=0 &
            weston_pid=$!
            sleep 3
            for d in "$base"/wayland/examples/*/; do
              [ -f "$d/dub.sdl" ] || continue
              echo "::group::wayland $d"
              WAYLAND_DISPLAY=wsi-ci dub run --compiler=ldc2 --root="$d"
              echo "::endgroup::"
            done
            kill "$weston_pid"
          fi

  # The runnable markdown examples (README.md, the guidelines, the research
  # catalogs): every ` ```d ` fence with a dub recipe is built, run, and its
  # output compared with the ` ```ansi ` block beside it. 140 examples, each an
  # isolated dub build with its own DUB_HOME, so the cost is the closure build
  # per example — which parallelises across workers and across shards. This
  # used to be the tail of the `lint` job, where it ran 16 min single-threaded
  # (see the `SPARKLES_CI_JOBS` note in `examples`).
  md-examples:
    name: Markdown examples (shard ${{ matrix.shard }}/2)
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      # The markdown RENDERING fixtures are inputs to the golden suite, not
      # runnable examples — a fixture may hold any code (a deliberately huge
      # dub script, a fence with fake paths) purely for how it renders. Same
      # exclusion as the `verify-md-examples` pre-commit hook.
      - name: Verify markdown runnable examples
        run: |
          ci --verify --fail-fast --shard ${{ matrix.shard }}/2 \
            --include-files '**.md' \
            --exclude-files 'libs/syntax/test/data/**' 'libs/source-view/test/data/**'
        env:
          SPARKLES_CI_JOBS: 4

  # The test runner's extracted-test modes. `--test` does not cover these: a
  # @betterC test runs as an ordinary unittest there, and only `--better-c`
  # additionally extracts it, compiles it without druntime, and runs the
  # result — so a break in the extraction, the -betterC codegen, or the wasm32
  # cross-compile is invisible to `dub test`.
  #
  # One job rather than a matrix leg: `--wasm` needs LDC specifically (it is
  # -mtriple/llvm_trap based), so a dmd leg could only skip. Linux-only for
  # now — the hosted macOS runner is the flaky/slow one, and these modes
  # exercise the compiler far more than the host.
  extracted-tests:
    name: Extracted test modes (--better-c, --wasm)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
            !~/.dub/cache/sparkles
          key: x86_64-linux-ldc2-dub-extracted-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            x86_64-linux-ldc2-dub-extracted-

      # Both modes normally *skip* when their toolchain is missing, which is
      # right on a contributor's machine and exactly wrong here. `ci
      # --test-extracted` passes the runner's `--require-toolchain`, turning
      # any such skip into a failure — without it a missing wasm-ld would
      # leave this job green having run nothing.
      - name: Run --better-c and --wasm for every sub-package that uses them
        run: ci --test-extracted --fail-fast
        env:
          DC: ldc2

  # AddressSanitizer + LDC stack-overflow sanitizer. Linux LDC only: nixpkgs
  # LDC links gcc libasan on Linux and has no ASan runtime dylib on Darwin.
  # No UBSan: LDC rejects `-fsanitize=undefined` for D, and `-Xcc` never
  # reaches ImportC codegen (docs/research/sanitizers/ubsan.md). One `-t N`
  # leg on 4 MiB workers (the stack watermark is off under ASan).
  #
  # Sharded like `test` — every package is rebuilt with ASan, which made this
  # a 17–20 min job on its own; five shards of the same cost table bring a
  # shard to ~4 min of ASan builds plus the Nix fetch.
  sanitize:
    name: Sanitizers (ASan, stackovf, shard ${{ matrix.shard }}/5)
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No history needed: dub's `git describe` version only names the
          # in-tree build dir, which never hits the cache across checkouts.
          fetch-depth: 1

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      # Its own key family. dub hashes `$DFLAGS` into every build id, so an
      # ASan build shares nothing with a plain one; falling back to the test
      # job's `x86_64-linux-ldc2-dub-` cache would only restore dead weight,
      # and saving the union back would let the test job restore ours in turn
      # — doubling both caches. `asan-dub` matches neither. Per shard for the
      # same reason as the test job's key.
      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
            !~/.dub/cache/sparkles
          key: x86_64-linux-asan-dub-${{ matrix.shard }}-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            x86_64-linux-asan-dub-${{ matrix.shard }}-
            x86_64-linux-asan-dub-

      - name: Run tests under ASan / stackovf
        run: ci --test-sanitize --fail-fast --shard ${{ matrix.shard }}/5
        env:
          DC: ldc2

  # Build the Nix outputs and push them to the binary cache, once per system
  # (the derivations are compiler-agnostic — they always build with ldc — so
  # this is independent of the `test` job's DC matrix). `.#all-desktop` is the
  # aggregate defined in nix/packages/all.nix: the full dev shell, every
  # desktop package, and every standalone example. The Android closure builds
  # in its own `nix-build-android` job below.
  nix-build:
    name: Nix build & push (${{ matrix.runner }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.runner }}
    # `.#all-desktop` builds the whole closure; normally 2-4m from cache, but
    # a cold-cache rebuild (after a flake.lock bump) needs real margin.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      # `with-cachix.sh` pushes each path as it is built, so a failure in the
      # step below still leaves this build's outputs in the cache. The
      # setup-nix action's post-job hook (push-to-cache: true) then pushes
      # anything else the job produced.
      - name: Build & push devShells.full, all packages, and all examples
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: ci/with-cachix.sh nix build --print-build-logs .#all-desktop

      - name: Run all runnable examples
        run: nix run .#run-all-examples

  # The Android APK pipeline (nix/packages/android/): builds `.#all-android`
  # — the repo-embedded hue APK, whose dependency chain covers the entire
  # cross closure (dual-ABI druntimes via dlang.nix's ldc-android, the
  # raylib/tree-sitter/libghostty-vt cross builds, every grammar parser, the
  # Maple font build, and the aapt2/zipalign/apksigner assembly). Linux-only:
  # the NDK/SDK ship prebuilt for x86_64-linux alone. The unfree Android SDK
  # licence is accepted inside the scoped nixpkgs import
  # (nix/packages/android/sdk.nix) — no env flags needed here.
  nix-build-android:
    name: Nix build & push (Android APK)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # From a warm cache this is minutes; a cold cache rebuilds the cross
    # druntimes and the Maple font pipeline — give it real headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      - name: Build & push the Android APK closure
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: ci/with-cachix.sh nix build --print-build-logs .#all-android

  lint:
    name: Lint & markdown link check
    runs-on: ubuntu-latest
    # ~2 min on a pull request; the full link sweep on `main`/`schedule` is
    # the long tail and depends on the hosts it checks.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          nix-github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: pre-commit

      - name: Restore lychee cache
        uses: actions/cache/restore@v6
        with:
          path: .lycheecache
          enableCrossOsArchive: true
          key: cache-lychee-v4-${{ github.run_id }}
          restore-keys: |
            cache-lychee-v4-

      # Everything over the whole tree EXCEPT the networked link check — which
      # includes `lychee-offline`, a ~0.4 s pass that catches the thing a diff
      # cannot see: a renamed heading or a deleted page breaking a relative link
      # in a file this change never touched.
      #
      # `verify-md-examples` runs as the `md-examples` job above.
      # `no-commit-to-branch` is a local developer guard (don't commit on main);
      # on push-to-main the checkout is that branch, so the hook would fail the
      # job that exists precisely to seed caches and re-check links after merge.
      - name: Lint (and check local links)
        run: prek run --all-files --show-diff-on-failure --color always
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP: verify-md-examples,lychee,no-commit-to-branch

      # The networked half, over the DIFF only. A pull request can only
      # introduce a dead URL in a file it touched, and re-checking the other
      # ~8.7k links costs minutes and depends on a cache that PR-scoped caches
      # evict. Rot in untouched files is found by the scheduled sweep instead —
      # it appears with nobody committing, so a pull request is the wrong place
      # to look for it.
      - name: Check links added or changed by this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          prek run lychee \
            --from-ref "origin/$BASE_REF" --to-ref HEAD \
            --show-diff-on-failure --color always
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}

      # The full network sweep: every link in the repository, on a schedule and
      # on `main`, where minutes are free and the cache it writes lands in the
      # base scope every other run can read.
      - name: Check every link
        if: github.event_name != 'pull_request'
        run: prek run lychee --all-files --show-diff-on-failure --color always
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .lycheecache
          enableCrossOsArchive: true
          # Same reasoning as the CircleCI `lint` job: lychee's cache has to
          # keep growing, and neither provider overwrites an existing key — so
          # the key changes every run while the restore prefix stays stable.
          # The old fixed `cache-lychee-v3` key made every save after the first
          # a silent no-op, freezing the cache at its first-ever contents.
          key: cache-lychee-v4-${{ github.run_id }}

  docs:
    name: Build documentation site
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ~8 min: the three generated inputs (wasm module, twoslash showcase,
    # source listings) build concurrently, then VitePress takes ~3 min.
    # Headroom for runner contention, which once stretched a 15m cap past
    # every real step having succeeded.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `npm run docs:build` first runs `build:wasm`, which invokes
      # `nix build .#table-wasm` to compile the drawTable playground module.
      # Install Nix and wire up the binary cache so the ldc-wasm toolchain is
      # pulled from the cache rather than built from source.
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The site build sits just under node's default ~4 GB heap and tips over
      # it intermittently (the failure is an "Ineffective mark-compacts near
      # heap limit" abort, not a dead link), so give V8 room rather than
      # re-running the job until it lands on the right side of the line.
      - name: Build VitePress site
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run docs:build

  # The single required check. Branch protection and the merge queue gate on
  # job *names*, so without a fan-in every new job has to be added to that
  # list by hand — and until someone does, it can fail while PRs merge green.
  # Gate on `CI` instead and this stays true as jobs come and go.
  #
  # `if: always()` so the job still runs when a dependency failed (otherwise
  # it would be skipped, which branch protection reads as "not failed").
  # Skipped dependencies are tolerated; failed and cancelled ones are not.
  #
  # Reported to GitHub as `CI`. That is the one check to require when GitHub
  # Actions is the primary provider (it currently is); CircleCI's equivalent is
  # `ci/circleci: ci`. Switching providers is that single change — see
  # ci/README.md § Switching the primary provider.
  ci:
    name: CI
    needs:
      - test
      - test-windows
      - examples
      - wsi-demos
      - md-examples
      - extracted-tests
      - sanitize
      - nix-build
      - nix-build-android
      - lint
      - docs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded or was skipped
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$r'"; exit 1 ;;
            esac
          done
