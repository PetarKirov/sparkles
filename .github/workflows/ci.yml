name: CI

on:
  # The rebuild path. When a merge lands a tree no pull request built (the base
  # moved under it), `main-checks.yml` calls this workflow as a reusable one, so
  # the jobs below run inside that push's own run and their checks land on the
  # pushed commit. Calling rather than dispatching is deliberate: a workflow's
  # `GITHUB_TOKEN` cannot reliably trigger a `workflow_dispatch`, and a dispatch
  # would race the branch tip rather than naming the commit it is judging.
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      # The R2 binary cache (ci/with-cache.sh). Without them the rebuild path
      # still builds, but pushes nothing.
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      NIX_R2_SIGNING_KEY:
        required: false

  # Manual runs against any ref.
  workflow_dispatch:

  # Merge queues. Enabling one is a repository setting, not a workflow change:
  # the queue builds its own ref from the pull requests it batches and runs this
  # workflow against it, which is the *only* run that ever sees the combined
  # result. See the note below on why that matters here.
  merge_group:

  # Run this workflow for all PRs:
  pull_request:

# Every job below runs on every event above, and none of them carries an `if:`
# guard. That is deliberate, and it is the property to preserve when editing:
#
#   * A merge-queue run that skipped the matrix would gate merges on nothing —
#     testing the batched result is the entire purpose of a queue. The guards
#     that used to sit here (`event_name != 'merge_group'`, and before that
#     `== 'pull_request'`) would have made adopting one silently vacuous.
#   * A *called* workflow reports the caller's event, so on `main-checks.yml`'s
#     rebuild path `github.event_name` is `push`. A job gated to `pull_request`
#     would make that rebuild report green having built nothing.
#
# The guards existed for the `push`-to-`main` and `schedule` triggers this
# workflow no longer has: `main-checks.yml` owns the default branch and
# `link-check.yml` owns the nightly sweep. Nothing reaching this file now wants
# less than the full matrix, so gate on the trigger list, not on `if:`.

# Least privilege by default: no job here writes to the repository. The R2
# cache push authenticates with its own keys, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are worth cancelling; a dispatched rebuild of `main` is
  # not — it is the only thing standing behind that commit's checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The test shards come from data, not from this file (CIC14, apps/ci PLAN
  # M3a). `ci/placements.json` declares each placement: its system, compiler,
  # test mode, shard count and runner. `ci placements list` turns that into
  # one matrix per mode, and names the `refs/perf/data` commit every shard
  # packs from. Each shard then runs `ci test --placement P --shard K/N`,
  # which packs the placement's packages longest first by the median wall time
  # of their last five recorded runs (observability OD21), so no workflow
  # names a package and a package added to dub.sdl is tested without editing
  # one. Each shard uploads its run record; `main-checks.yml` appends the
  # records of the run that validated `main`'s tree to the history.
  placements:
    name: Plan the test shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      test: ${{ steps.plan.outputs.matrix-test }}
      sanitize: ${{ steps.plan.outputs.matrix-sanitize }}
      extracted: ${{ steps.plan.outputs.matrix-extracted }}
      tip: ${{ steps.plan.outputs.tip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      - name: List the placements and their history
        id: plan
        run: nix run .#ci-minimal -- placements list --github-output "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.placement }}, ${{ matrix.shard }})
    needs: placements
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.placements.outputs.test) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
          # Keyed by system, not runner.os: that is "Linux" for x86_64 and
          # arm64 alike, and two legs sharing one cache corrupt it for each other.
          key: ${{ matrix.system }}-dub-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            ${{ matrix.system }}-dub-

      - name: Test the shard's packages
        run: ci test --fail-fast --interlaced --placement "$PLACEMENT" --shard "$SHARD" --history-tip "$TIP"
        env:
          # The compiler the placement tests with; both are on PATH via the
          # `ci` dev shell, and `ci` itself embeds dmd.
          DC: ${{ matrix.compiler }}
          PLACEMENT: ${{ matrix.placement }}
          SHARD: ${{ matrix.shard }}
          TIP: ${{ needs.placements.outputs.tip }}

      # CIC13: every run re-executes a sample of the actions its builds ran
      # or reused, into a private store; a difference fails the job.
      - name: Check a sample of the shard's builds for determinism
        run: ci cache verify --rerun
        env:
          DC: ${{ matrix.compiler }}

      - name: Upload the run record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-records-test-${{ strategy.job-index }}
          path: ~/.cache/sparkles/perf/runs
          if-no-files-found: ignore
          retention-days: 30

  # Everything a test leg's first shard used to run beside its tests, one job
  # per system: flake checks, the configuration-specific test builds, the
  # examples, the GPU read-backs and the windowing demos, and Windows' own
  # suite, which runs without Nix through ci/test-windows.sh.
  platform:
    name: platform (${{ matrix.system }}, ${{ matrix.DC }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            DC: ldc2
            timeout: 75
          - runner: ubuntu-latest
            system: x86_64-linux
            DC: dmd
            timeout: 60
          - runner: macos-latest
            system: aarch64-darwin
            DC: ldc2
            timeout: 60
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            DC: ldc2
            timeout: 60
          # Native Windows — the host the `sparkles:wsi` Win32 backend had only
          # ever been certified on through Wine. There is no Nix on the hosted
          # runner, so this leg takes its toolchain from setup-dlang and runs
          # the suite through ci/test-windows.sh instead of the `ci` helper
          # (whose closure needs tree-sitter via pkg-config). Which packages it
          # covers, and why the rest are left out, is that script's business;
          # the Nix-only steps below are keyed off it by `runner.os`.
          - runner: windows-latest
            system: x86_64-windows
            DC: ldc2
            timeout: 40
    runs-on: ${{ matrix.runner }}
    # Budget the entire job, including a cold toolchain build and cleanup:
    # in run 43782517554 these steps took 28m on x86_64 LDC, 19m on DMD, 8m on
    # macOS and 4m on aarch64 Linux, besides a setup of 3 to 10m. The test
    # legs' history of caps, which these replace, is in git.
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Nix
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      # The Windows leg's toolchain (LDC plus the dub it bundles). Pinned to the
      # flake's LDC so every leg agrees on the compiler; ci/install-ldc-windows.sh
      # carries the same version for CircleCI.
      - name: Install D (LDC)
        if: runner.os == 'Windows'
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0

      - name: Cache DUB packages
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
          # Keyed by system, not runner.os: that is "Linux" for x86_64 and
          # arm64 alike, and two legs sharing one cache corrupt it for each other.
          key: ${{ matrix.system }}-dub-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            ${{ matrix.system }}-dub-

      # dub keeps its package store under %LOCALAPPDATA% on Windows, and the
      # cache action does not accept a per-OS path list, hence the second step.
      - name: Cache DUB packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/dub
          key: ${{ matrix.system }}-dub-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            ${{ matrix.system }}-dub-

      - name: Run flake checks
        if: matrix.system != 'aarch64-linux' && runner.os != 'Windows'
        run: nix flake check

      # sparkles:shaders SHT3 on its third platform: the Nix build job, which
      # hashes `ui-shaders` on x86_64 Linux and macOS, has no aarch64 Linux
      # runner, so this leg hashes it there for `shader-reproducibility`. It
      # runs before the tests, so a failing test cannot drop the platform.
      - name: Hash the generated shaders
        if: matrix.system == 'aarch64-linux'
        run: |
          for p in ui-shaders vulkan-wsi-shaders; do
            out="$(nix build --no-link --print-out-paths ".#$p")"
            ls -A "$out"
            echo "$p $(nix hash path --type sha256 "$out")"
          done | tee "shaders-${{ runner.os }}-${{ runner.arch }}.hash"

      - name: Upload the generated shaders' hash
        if: matrix.system == 'aarch64-linux'
        uses: actions/upload-artifact@v7
        with:
          name: shaders-${{ runner.os }}-${{ runner.arch }}
          path: shaders-${{ runner.os }}-${{ runner.arch }}.hash

      - name: The terminal on the raylib arm
        if: runner.os == 'Linux'
        run: dub test :terminal --compiler=${{ matrix.DC }} -c unittest-raylib

      # `ci test` without the `ci` helper: `dub test` per allowlisted
      # sub-package, `-t 1` then `-t 0`, under Git Bash so the script shares
      # ci/lib/common.sh with CircleCI's bash.exe.
      - name: Build and test with dub (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ci/test-windows.sh
        env:
          DC: ${{ matrix.DC }}

      # sparkles.base.sync's portable thread parker binds its OS's condition
      # variable itself, so each OS builds it (DS24); the `sync` job covers
      # x86-64 Linux.
      - name: base.sync with the portable parker
        if: (runner.os == 'macOS' || runner.os == 'Windows')
        shell: bash
        run: dub test :base --compiler=${{ matrix.DC }} -c unittest-portable -- -i 'sync\.'

      # Oracle 9, base.sync's litmus tests, optimized: on arm64 every
      # deliberately weakened primitive must show a stale read. `dub test`'s
      # unoptimized build cannot, so this is the oracle.
      - name: base.sync litmus tests
        if: runner.arch == 'ARM64'
        run: dub run --single --temp-build libs/base/tools/check-sync-litmus.d

      - name: Build and run examples
        if: matrix.system != 'aarch64-linux' && runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dub run --single apps/ci/tools/prepare-event-horizon-comparisons.d --temp-build -b checked
          fi
          ci examples standalone --fail-fast

      # sparkles:shaders' agreement evidence (SHV7, SHF4): a probe unit compiled
      # by shader-compile runs on Mesa's software rasterizer under Xvfb, and its
      # results are read back against the host's, for the GLSL 3.30 and the
      # GLSL ES 1.00 output alike. The runner is not NixOS, so
      # the Nix-built raylib is pointed at the flake's Mesa explicitly. Opted
      # into, the test fails rather than skips when it cannot run.
      - name: Read back generated shaders on a GL driver
        if: matrix.system == 'x86_64-linux' && matrix.DC == 'ldc2'
        run: |
          mesa="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa)"
          export LIBGL_DRIVERS_PATH="$mesa/lib/dri"
          export LD_LIBRARY_PATH="$mesa/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          SPARKLES_GPU_READBACK=1 xvfb-run -a dub test :ui-raylib -- -i shader_readback

      # sparkles:shaders M6: the triangle's D shaders, compiled to SPIR-V by
      # shader-compile, drawn offscreen by Mesa's software Vulkan driver
      # (lavapipe) at three aspects, and read back against the host's
      # evaluation of the same vertex function, with the Khronos validation
      # layer loaded and no message allowed. Opted into, the test fails rather
      # than skips when it cannot run.
      - name: Read back the triangle on a Vulkan driver
        if: matrix.system == 'x86_64-linux' && matrix.DC == 'ldc2'
        run: |
          mesa="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa)"
          layers="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#vulkan-validation-layers)"
          export VK_DRIVER_FILES="$mesa/share/vulkan/icd.d/lvp_icd.x86_64.json"
          export VK_LAYER_PATH="$layers/share/vulkan/explicit_layer.d"
          SPARKLES_VULKAN_READBACK=1 dub test :vulkan-wsi -- -i triangle_readback

      # OS-API research examples (docs/research/.../os-apis). These are multi-file
      # dub packages (ImportC), not single-file, so they are outside `ci
      # ci examples standalone`; build/run the Linux ones here in the devshell. X11 opens a
      # real window under xvfb; Wayland has no compositor in CI so it prints SKIP and
      # exits 0. (macOS/iOS/Android are verified out of band — see the surveys.)
      - name: Build & run OS-API windowing examples (X11 + Wayland)
        if: matrix.system == 'x86_64-linux' && matrix.DC == 'ldc2'
        run: |
          xvfb-run -a dub run --compiler=ldc2 --root=docs/research/window-system-integration/os-apis/x11/example
          dub run --compiler=ldc2 --root=docs/research/window-system-integration/os-apis/wayland/example
          # Interactive GUI probe — compile only; running it would sit in a
          # window loop until the job timed out.
          dub build --single --compiler=ldc2 \
            docs/research/window-system-integration/cursor-shapes/cursor-shapes.d

      # Per-feature windowing demos (os-apis/<platform>/examples/{scaffold,fXX-*}).
      # Demos exit after a bounded run when WSI_AUTO_EXIT=1 and print `SKIP:` +
      # exit 0 when a host capability is missing — a missing capability must never
      # red the build. X11 demos run under Xvfb; Wayland demos under a headless
      # weston instance.
      - name: Build & run OS-API windowing demos (X11 + Wayland)
        if: matrix.system == 'x86_64-linux' && matrix.DC == 'ldc2'
        env:
          WSI_AUTO_EXIT: 1
        run: |
          base=docs/research/window-system-integration/os-apis
          for d in "$base"/x11/examples/*/; do
            [ -f "$d/dub.sdl" ] || continue
            echo "::group::x11 $d"
            xvfb-run -a dub run --compiler=ldc2 --root="$d"
            echo "::endgroup::"
          done
          if ls -d "$base"/wayland/examples/*/ >/dev/null 2>&1; then
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            weston --backend=headless --socket=wsi-ci --idle-time=0 &
            weston_pid=$!
            sleep 3
            for d in "$base"/wayland/examples/*/; do
              [ -f "$d/dub.sdl" ] || continue
              echo "::group::wayland $d"
              WAYLAND_DISPLAY=wsi-ci dub run --compiler=ldc2 --root="$d"
              echo "::endgroup::"
            done
            kill "$weston_pid"
          fi

      # The native half of what libs/wsi/scripts/verify-win32-wine.sh certifies
      # under Wine: the shared WSI conformance suite through the Win32 driver,
      # on a real User32 and IOCP. Wine is a compatibility lane, not native
      # evidence — its monitors are fixed at 96 DPI and its modal loops depend
      # on which display driver loaded — which is why the spec's comparison.md
      # carried "native Windows CI" as an owed column. Counts are pinned as in
      # every other lane, so a driver that skipped everything cannot pass. The
      # IMM32 preedit phase is the one thing this host cannot show: the runner's
      # US layout has no IME UI, so the driver sees the result-string commit but
      # no preedit, and says so — the preedit evidence stays with the Wine lane.
      - name: Build & run the sparkles:wsi Win32 conformance driver
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dub run --single --compiler=ldc2 libs/wsi/examples/win32-hosted-smoke.d | tee smoke.log
          grep -q '^ok: Win32 WSI conformance (18 checked, 4 skipped)' smoke.log
          grep -q '^ok: Win32 text commit' smoke.log

      # The Win32 counterpart of the X11/Wayland OS-API steps above: the research
      # example and the per-feature demos, on druntime's core.sys.windows alone.
      # WSI_AUTO_EXIT bounds each demo's run; the interactive parts are exercised
      # by hand and under Wine locally (see the manual-run queue).
      - name: Build & run OS-API windowing example and demos (Win32)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WSI_AUTO_EXIT: 1
        run: |
          base=docs/research/window-system-integration/os-apis
          echo "::group::win32 $base/win32/example"
          dub run --compiler=ldc2 --root="$base/win32/example"
          echo "::endgroup::"
          for d in "$base"/win32/examples/*/; do
            [ -f "$d/dub.sdl" ] || continue
            echo "::group::win32 $d"
            dub run --compiler=ldc2 --root="$d"
            echo "::endgroup::"
          done

  # The `@slow` unittests (sparkles:test-runner's marker for tests that take
  # minutes, such as the font oracle's corpus sweeps). `ci test` leaves them
  # out (`--skip-slow`), and they run here instead: one job per test and per
  # `test` leg, so a sweep runs beside the suite rather than adding its minutes
  # to every leg of it. Before this, `:font-oracle` alone took ~35 of the
  # aarch64-linux leg's 120 minutes and pushed macOS past its 90.
  #
  # The matrix comes from the sources (`ci slow-tests list`), so it exists
  # before anything is built; `.#ci-minimal` suffices for that scan. Each job
  # then checks that its package's test binary lists the same slow tests as
  # the scan did, so a test the scan misses fails here instead of going unrun.
  slow-tests-list:
    name: List the slow tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          use-nix-cache: false

      - name: Scan the sources for @slow tests
        id: list
        run: nix run .#ci-minimal -- slow-tests list

  slow-tests:
    name: slow (${{ matrix.leg.system }}, ${{ matrix.leg.DC }}, ${{ matrix.slow.test }})
    needs: slow-tests-list
    strategy:
      fail-fast: false
      matrix:
        # The `test` job's Nix legs. Windows is left out as it is from
        # `ci test`: ci/test-windows.sh runs its own package list.
        leg:
          - { runner: ubuntu-latest, system: x86_64-linux, DC: ldc2 }
          - { runner: ubuntu-latest, system: x86_64-linux, DC: dmd }
          - { runner: macos-latest, system: aarch64-darwin, DC: ldc2 }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux, DC: ldc2 }
        slow: ${{ fromJSON(needs.slow-tests-list.outputs.matrix) }}
    runs-on: ${{ matrix.leg.runner }}
    # Most of a job is fetching the dev shell and building one package's
    # tests; the slowest test takes about a minute locally.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The dev shell comes from the binary caches: `nix-build` pushes it to R2
      # as part of `.#all-desktop`. Like every job here, no GHA `/nix` cache
      # (setup-nix's `use-nix-cache` is off): the binary caches serve the store.
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci
          use-nix-cache: false

      # Restore only, from the `test` legs' key, for the same reason.
      - name: Restore DUB packages
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
          key: ${{ matrix.leg.system }}-dub-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            ${{ matrix.leg.system }}-dub-

      - name: Run the slow test
        run: ci test --slow --from "$SLOW_PACKAGE" --tests "$SLOW_TEST"
        env:
          DC: ${{ matrix.leg.DC }}
          SLOW_PACKAGE: ${{ matrix.slow.package }}
          SLOW_TEST: ${{ matrix.slow.test }}

  # The test runner's extracted-test modes. `ci test` does not cover these: a
  # @betterC test runs as an ordinary unittest there, and only `--better-c`
  # additionally extracts it, compiles it without druntime, and runs the
  # result — so a break in the extraction, the -betterC codegen, or the wasm32
  # cross-compile is invisible to `dub test`.
  #
  # One job rather than a matrix leg: `--wasm` needs LDC specifically (it is
  # -mtriple/llvm_trap based), so a dmd leg could only skip. Linux-only for
  # now — the hosted macOS runner is the flaky/slow one, and these modes
  # exercise the compiler far more than the host.
  extracted-tests:
    name: Extracted test modes (--better-c, --wasm)
    needs: placements
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.placements.outputs.extracted) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
          key: ${{ runner.os }}-dub-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            ${{ runner.os }}-dub-

      # Both modes normally *skip* when their toolchain is missing, which is
      # right on a contributor's machine and exactly wrong here. `ci
      # ci test --special-modes all` passes the runner's `--require-toolchain`, turning
      # any such skip into a failure — without it a missing wasm-ld would
      # leave this job green having run nothing.
      - name: Run --better-c and --wasm for every sub-package that uses them
        run: ci test --special-modes all --fail-fast --placement "$PLACEMENT"
        env:
          DC: ldc2
          PLACEMENT: ${{ matrix.placement }}

      - name: Upload the run record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-records-extracted-${{ strategy.job-index }}
          path: ~/.cache/sparkles/perf/runs
          if-no-files-found: ignore
          retention-days: 30

  # AddressSanitizer + LDC stack-overflow sanitizer. Linux LDC only: nixpkgs
  # LDC links gcc libasan on Linux and has no ASan runtime dylib on Darwin.
  # No UBSan: LDC rejects `-fsanitize=undefined` for D, and `-Xcc` never
  # reaches ImportC codegen (docs/research/sanitizers/ubsan.md). One `-t N`
  # leg on 4 MiB workers (the stack watermark is off under ASan).
  # Every package is rebuilt with ASan; a 30m cap cancelled mid-package
  # the same way the test job's old 20m cap did, and run 39361822480 passed
  # every package at 43.6m and was cancelled at 45m.
  # Main's runs take 48-59m; run 42395259454 (PR #719) was still testing,
  # nothing failed, when its 60m cap cancelled it: it now has 75m.
  # Its shards come from `ci/placements.json`, packed like the test job's.
  sanitize:
    name: Sanitizers (ASan, stackovf) (${{ matrix.shard }})
    needs: placements
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.placements.outputs.sanitize) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No history needed: dub's `git describe` version only names the
          # in-tree build dir, which never hits the cache across checkouts.
          fetch-depth: 1

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      # Its own key family. dub hashes `$DFLAGS` into every build id, so an
      # ASan build shares nothing with a plain one; falling back to the test
      # job's `x86_64-linux-dub-` cache would only restore dead weight, and
      # saving the union back would let the test job restore ours in turn
      # (its prefix matches `x86_64-linux-dub-*`) — doubling both caches in
      # an Actions cache already at its quota. `asan-dub` matches neither.
      - name: Cache DUB packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub
            ~/.local/share/dub
          key: x86_64-linux-asan-dub-${{ hashFiles('**/dub.sdl', '**/dub.selections.json') }}
          restore-keys: |
            x86_64-linux-asan-dub-

      - name: Run tests under ASan
        run: ci test --sanitize address --fail-fast --interlaced --placement "$PLACEMENT" --shard "$SHARD" --history-tip "$TIP"
        env:
          DC: ldc2
          PLACEMENT: ${{ matrix.placement }}
          SHARD: ${{ matrix.shard }}
          TIP: ${{ needs.placements.outputs.tip }}

      - name: Upload the run record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-records-sanitize-${{ strategy.job-index }}
          path: ~/.cache/sparkles/perf/runs
          if-no-files-found: ignore
          retention-days: 30

  # Build the Nix outputs and push them to the binary cache, once per system
  # (the derivations are compiler-agnostic — they always build with ldc — so
  # this is independent of the `test` job's DC matrix). `.#all-desktop` is the
  # aggregate defined in nix/packages/all.nix: the full dev shell, every
  # desktop package, and every standalone example. The Android closure builds
  # in its own `nix-build-android` job below.
  nix-build:
    name: Nix build & push (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.runner }}
    # `.#all-desktop` builds the whole closure; normally 2-4m from cache, but
    # a cold rebuild needs real margin: a change to a shared library rebuilds
    # every application, which took 26m on x86_64 in run 41293450019. The
    # toolchain itself is pinned in Cachix (nix/pin-targets.nix, TC24), so
    # no run compiles LLVM or the LDC fork.
    # `with-cache.sh` pushes each path as it completes, so even a run that
    # hits this cap leaves progress in the cache for the next one.
    # The macOS cold aggregate in run 37375104839 was still compiling desktop
    # applications at its 40m cap; allow the remaining closure and example run.
    # Linux builds one derivation at a time (below), and has the same 90m.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      # `with-cache.sh` pushes each path as it is built, so a failure in the
      # step below still leaves this build's outputs in the cache.
      # On Linux, one derivation at a time, as the Android closure below: with
      # every app built on both arms, the default parallelism ran the runner out
      # of memory mid-build, cancelled with no failed step (PR #719's runs
      # 42404867685 and 42413552229, while terminal and hue-raylib compiled).
      - name: Build & push devShells.full, all packages, and all examples
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIX_R2_SIGNING_KEY: ${{ secrets.NIX_R2_SIGNING_KEY }}
        run: ci/with-cache.sh nix build --print-build-logs ${{ matrix.runner == 'ubuntu-latest' && '--max-jobs 1' || '' }} .#all-desktop

      # Roots the build in the R2 cache's garbage collection (ci/gc-root.sh).
      - name: Record the build as an R2 cache root
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIX_R2_SIGNING_KEY: ${{ secrets.NIX_R2_SIGNING_KEY }}
        run: ci/gc-root.sh all-desktop

      - name: Run all runnable examples
        run: nix run .#run-all-examples

      # sparkles:shaders SHT3: the same sources and toolchain must generate the
      # same GLSL and SPIR-V on every platform. Each runner records the content
      # hash of its `ui-shaders` and `vulkan-wsi-shaders` (names, bytes, modes),
      # and `shader-reproducibility` compares them.
      - name: Hash the generated shaders
        run: |
          for p in ui-shaders vulkan-wsi-shaders; do
            out="$(nix build --no-link --print-out-paths ".#$p")"
            ls -A "$out"
            echo "$p $(nix hash path --type sha256 "$out")"
          done | tee "shaders-${{ runner.os }}-${{ runner.arch }}.hash"

      - name: Upload the generated shaders' hash
        uses: actions/upload-artifact@v7
        with:
          name: shaders-${{ runner.os }}-${{ runner.arch }}
          path: shaders-${{ runner.os }}-${{ runner.arch }}.hash

  shader-reproducibility:
    name: Generated shaders agree across platforms
    # The Nix build job hashes x86_64 Linux and aarch64 macOS; the aarch64
    # Linux test leg hashes the third (`SHT4`'s platforms).
    needs: [nix-build, platform]
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform's hash
        uses: actions/download-artifact@v8
        with:
          pattern: shaders-*
          merge-multiple: true

      - name: Compare
        run: |
          for f in shaders-*.hash; do echo "$f:"; cat "$f"; done
          hashes=(shaders-*.hash)
          [ "${#hashes[@]}" -eq 3 ] || { echo "::error::${#hashes[@]} platforms reported, not 3"; exit 1; }
          [ "$(for f in shaders-*.hash; do sha256sum < "$f"; done | sort -u | wc -l)" -eq 1 ] || { echo "::error::the generated shaders differ between platforms (SHT3)"; exit 1; }

  # The Android APK pipeline (nix/packages/android/): builds `.#all-android`
  # — the repo-embedded hue APK, whose dependency chain covers the entire
  # cross closure (dual-ABI druntimes via dlang.nix's ldc-android, the
  # raylib/tree-sitter/libghostty-vt cross builds, every grammar parser, the
  # Maple font build, and the aapt2/zipalign/apksigner assembly). Built on
  # Linux only, to keep the cross closure off the macOS runners; the same
  # outputs exist on aarch64-darwin (nix/packages/android/host.nix), where the
  # macOS leg's `nix flake check` evaluates every one of them. The unfree Android SDK
  # licence is accepted inside the scoped nixpkgs import
  # (nix/packages/android/sdk.nix) — no env flags needed here.
  nix-build-android:
    name: Nix build & push (Android APK)
    runs-on: ubuntu-latest
    # From a warm cache this is minutes; a cold cache rebuilds the cross
    # druntimes and the Maple font pipeline — give it real headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          # This store's 8 GiB compressed archive exhausted the runner while
          # restoring it (run 42023216277). with-cache.sh already preserves
          # each completed output, including progress from interrupted runs.
          use-nix-cache: false

      # One derivation at a time: the compiler peaks at 9.4 GiB building
      # `libhue-android` and at 7.1 GiB building the terminal's raylib library
      # (`libterminal-raylib-android`), and the runner has 16. Built together, as the default parallelism does, they ran
      # the runner out of memory, and the job was cancelled mid-build with no
      # failed step (runs 39334458752 and 39400408038, three and two times).
      - name: Build & push the Android APK closure
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIX_R2_SIGNING_KEY: ${{ secrets.NIX_R2_SIGNING_KEY }}
        run: ci/with-cache.sh nix build --print-build-logs --max-jobs 1 .#all-android

      - name: Record the build as an R2 cache root
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIX_R2_SIGNING_KEY: ${{ secrets.NIX_R2_SIGNING_KEY }}
        run: ci/gc-root.sh all-android

  # Toolchain spec TC20: terminal and hue as self-contained programs under the
  # all-LLVM runtime profile (nix/packages/static-apps.nix), their checks and
  # their test suites, on both Linux architectures. Not flake `checks`: the
  # `test` legs' `nix flake check` would rebuild both programs and run both
  # suites under Xvfb on every source change.
  static-apps:
    name: Static apps (TC20, ${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, system: x86_64-linux }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
    runs-on: ${{ matrix.runner }}
    # The bundled C and C++ libraries and the profile-built grammars come
    # from the cache; a cold cache compiles them (OpenSSL's tests are the
    # longest part) before the two programs and their suites.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      # `with-cache.sh` pushes each path as it completes, so a run that fails
      # or hits the cap still leaves its progress in the cache. One build at a
      # time: each of the four compiles the DMD frontend, and four at once
      # exhausted the arm runner's memory and took the runner down.
      - name: Build & push the static programs, their checks and test suites
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIX_R2_SIGNING_KEY: ${{ secrets.NIX_R2_SIGNING_KEY }}
        run: |
          ci/with-cache.sh nix build --print-build-logs --keep-going --max-jobs 1 \
            .#legacyPackages.${{ matrix.system }}.staticAppChecks.terminal-static \
            .#legacyPackages.${{ matrix.system }}.staticAppChecks.terminal-static-tests \
            .#legacyPackages.${{ matrix.system }}.staticAppChecks.hue-static \
            .#legacyPackages.${{ matrix.system }}.staticAppChecks.hue-static-tests

      - name: Record the build as an R2 cache root
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIX_R2_SIGNING_KEY: ${{ secrets.NIX_R2_SIGNING_KEY }}
        run: ci/gc-root.sh static-apps

  lint:
    name: Lint & markdown link check
    runs-on: ubuntu-latest
    # 24-35m, most of it verifying the markdown examples (31m in run
    # 39435191749, which the old 35m cap cancelled).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          nix-github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: pre-commit

      - name: Restore lychee cache
        uses: actions/cache/restore@v6
        with:
          path: .lycheecache
          enableCrossOsArchive: true
          key: cache-lychee-v4-${{ github.run_id }}
          restore-keys: |
            cache-lychee-v4-

      # Everything over the whole tree EXCEPT the networked link check — which
      # includes `lychee-offline`, a ~0.4 s pass that catches the thing a diff
      # cannot see: a renamed heading or a deleted page breaking a relative link
      # in a file this change never touched.
      #
      # `no-commit-to-branch` is a local developer guard (don't commit on main);
      # on push-to-main the checkout is that branch, so the hook would fail the
      # job that exists precisely to seed caches and re-check links after merge.
      - name: Lint (and check local links)
        run: prek run --all-files --show-diff-on-failure --color always
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP: verify-md-examples,lychee,no-commit-to-branch

      # The networked half, over the DIFF only. A pull request can only
      # introduce a dead URL in a file it touched, and re-checking the other
      # ~8.7k links costs minutes and depends on a cache that PR-scoped caches
      # evict. Rot in untouched files is found by the scheduled sweep instead —
      # it appears with nobody committing, so a pull request is the wrong place
      # to look for it.
      - name: Check links added or changed by this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          prek run lychee \
            --from-ref "origin/$BASE_REF" --to-ref HEAD \
            --show-diff-on-failure --color always
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}

      # The full network sweep lives in `link-check.yml` now. Making a dead
      # third-party URL a dependency of the `CI` fan-in meant somebody else's
      # expired domain turned this repository red; it reports into a standing
      # issue instead. `lychee-offline`, above, still covers every relative
      # link in the tree — the half a change here can actually break.

      # Half an hour of runner time, and a real gate: it runs on the rebuild
      # path too, because a dispatched run of this workflow exists precisely to
      # say whether a commit on the branch builds.
      - name: Verify markdown runnable examples
        # A transient load spike after Nix setup selected one worker for all
        # 272 examples and exhausted the 35m job budget. Bound fan-out to two
        # on this four-core runner, retaining headroom for compiler memory.
        env:
          SPARKLES_CI_JOBS: '2'
        run: |
          # The pre-commit shell exposes the packaged verifier, not DUB.
          nix develop .#ci --command dub run --single apps/ci/tools/prepare-event-horizon-comparisons.d --temp-build -b checked
          # Inside the CI shell, so examples over a C library (tree-sitter,
          # through pkg-config) find its headers.
          nix develop .#ci --command ci examples verify --fail-fast --include-files '**.md' --exclude-files 'libs/syntax/test/data/**' 'libs/source-view/test/data/**'

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .lycheecache
          enableCrossOsArchive: true
          # Same reasoning as the CircleCI `lint` job: lychee's cache has to
          # keep growing, and neither provider overwrites an existing key — so
          # the key changes every run while the restore prefix stays stable.
          # The old fixed `cache-lychee-v3` key made every save after the first
          # a silent no-op, freezing the cache at its first-ever contents.
          key: cache-lychee-v4-${{ github.run_id }}

  docs:
    name: Build documentation site
    runs-on: ubuntu-latest
    env:
      # Corepack asks before downloading the packageManager pin. CI must not.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    # The build itself runs ~11m; under runner contention the nix teardown
    # stretched past a 15m cap and cancelled after every real step had
    # succeeded. 30m matches the test job's headroom.
    # The site embeds the wasm modules, whose toolchain is pinned in Cachix
    # (TC24), so it is never rebuilt here; but a change to a shared library
    # rebuilds the tools the site build runs, as in the docs deploy
    # (docs.yml): #708 took 29m of this cap, #709 17m. It has 45m.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # setup-node's `cache: yarn` calls `yarn --version` while the action
      # runs, before Corepack has put Yarn on PATH. Enable Corepack first,
      # then cache the folder Yarn itself reports.
      - name: Enable Corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      # The site build sits just under node's default ~4 GB heap and tips over
      # it intermittently (the failure is an "Ineffective mark-compacts near
      # heap limit" abort, not a dead link), so give V8 room rather than
      # re-running the job until it lands on the right side of the line.
      - name: Build VitePress site
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: yarn docs:build

  # The single required check. Branch protection and the merge queue gate on
  # job *names*, so without a fan-in every new job has to be added to that
  # list by hand — and until someone does, it can fail while PRs merge green.
  # Gate on `CI` instead and this stays true as jobs come and go.
  #
  # `if: always()` so the job still runs when a dependency failed (otherwise
  # it would be skipped, which branch protection reads as "not failed").
  # Skipped dependencies are tolerated; failed and cancelled ones are not.
  #
  # Reported to GitHub as `CI`. That is the one check to require when GitHub
  # Actions is the primary provider (it currently is); CircleCI's equivalent is
  # `ci/circleci: ci`. Switching providers is that single change — see
  # ci/README.md § Switching the primary provider.
  # `ci/prepare-cloud-env.sh` is the one-line setup an ephemeral agent container
  # runs (Claude Code on the web, and anything comparable). It is the only entry
  # point here that bootstraps its *own* toolchain, so it cannot be covered by
  # the jobs above — they all start from `setup-nix`, which is exactly the state
  # the script exists to create. Hence a job that deliberately does not use it:
  # bare `actions/checkout`, no Nix, no caches, nothing on PATH.
  #
  # The `restricted` leg is the point of the matrix. A hosted runner has open
  # egress, so the script's probes would take the fast native paths and the two
  # workarounds that make an agent container work at all — the flake.lock
  # github:→git+https rewrite, and seeding dub registry packages from git —
  # would never execute. CI_FORCE_GIT_INPUTS / CI_FORCE_GIT_DEPS force them, so
  # both paths are exercised without needing a proxy that blocks codeload.
  cloud-env:
    name: cloud-env (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # What a container with open egress gets: tarball flake inputs and a
          # plain `dub` registry fetch.
          - mode: native
            force: '0'
          # What an agent container actually gets.
          - mode: restricted
            force: '1'
    runs-on: ubuntu-latest
    # Cold: installs Nix, resolves 33 flake inputs and substitutes devShells.ci.
    # The `restricted` leg additionally clones every input over git. This is
    # minutes *provided the Cachix caches apply* — the script asserts that, so a
    # regression fails fast here rather than compiling LDC and DMD until the cap.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No setup-nix, no cache restore, no devshell: proving the script needs
      # none of them is the test.
      - name: Assert the runner starts clean
        run: |
          if command -v nix >/dev/null 2>&1; then
            echo "::error::nix is already on PATH; this job must start without it"
            exit 1
          fi
          if command -v dub >/dev/null 2>&1; then
            echo "::error::dub is already on PATH; this job must start without it"
            exit 1
          fi

      - name: Run the setup script
        run: ci/prepare-cloud-env.sh
        env:
          # The CI floor — smallest closure, and the shell this repo's own jobs
          # use. Also covers the documented CI_DEVSHELL override.
          CI_DEVSHELL: ci
          CI_FORCE_GIT_INPUTS: ${{ matrix.force }}
          CI_FORCE_GIT_DEPS: ${{ matrix.force }}

      # A separate step on purpose: the script exports PATH through `ci_export`,
      # so this only passes if that export actually reached $GITHUB_ENV — the
      # failure mode the script exists to prevent (a toolchain that works in the
      # setup shell and nowhere else).
      - name: Toolchain survives into a later step
        run: |
          echo "dub: $(command -v dub)"
          echo "ldc2: $(command -v ldc2)"
          dub --version
          ldc2 --version | head -n1

      # The failure this job was written to catch second: the script can look
      # like it worked while every derivation was built from source, because a
      # daemon silently discards an untrusted user's substituter list. That is
      # an hour of compiling, not an error. Assert the caches are in effect.
      - name: Project caches are actually in effect
        run: |
          substituters=$(nix config show substituters)
          echo "substituters: $substituters"
          echo "trusted user: $(nix store info --json)"
          case "$substituters" in
            *sparkles.cachix.org*) ;;
            *) echo "::error::sparkles.cachix.org is not an effective substituter"; exit 1 ;;
          esac

      - name: Tests actually run
        run: dub test :base

      - name: Re-running is idempotent
        run: ci/prepare-cloud-env.sh
        env:
          CI_DEVSHELL: ci
          CI_FORCE_GIT_INPUTS: ${{ matrix.force }}
          CI_FORCE_GIT_DEPS: ${{ matrix.force }}

      # The rewrite is a local accommodation. If it ever reaches a commit, every
      # other consumer of this lock gets shallow git inputs and the `--inputs-from`
      # resolution that `ci_nix_run` depends on stops working.
      - name: flake.lock is not modified in a way that could be committed
        run: |
          if [ -n "$(git diff --name-only -- flake.lock)" ]; then
            echo "::error::flake.lock shows as modified; the skip-worktree guard did not hold"
            git diff --stat -- flake.lock
            exit 1
          fi

  # Complete authenticated Unicode 18 corpora, not samples. The Nix check
  # builds the existing harness offline and executes it in the build sandbox.
  text-conformance:
    name: Owned Unicode conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      - name: Run complete offline official corpora
        run: nix build -L .#checks.x86_64-linux.text-conformance

  # The WebAssembly modules' checks. The site's modules against the same D run
  # natively (docs/specs/toolchain/wasm-modules.md TCM9) and the npm package's
  # tests under node (docs/specs/wired/wasm WW13); then the Nix module (WW10):
  # `builtins.wasm` exists only in Determinate Nix, behind `wasm-builtin`, so
  # this job installs that evaluator, and the module must agree with the native
  # oracle on every tracked recipe and fixture, and the recipe table's two
  # readers with each other.
  nix-wasm:
    name: WebAssembly modules (site, npm, Nix builtins.wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      - name: Check the site's modules and the npm package
        run: nix build -L .#checks.x86_64-linux.wasm-modules .#checks.x86_64-linux.npm-wired

      - name: Check the module against the native oracle and the regex readers
        run: nix run -L .#check-nix-wasm

  # sparkles.base.sync's evidence that no other job produces
  # (docs/specs/base/sync/testing.md): the portable thread parker on a leg
  # with a native seam (oracle 5, DS24), and the TLA+ protocol model
  # (oracle 10).
  sync:
    name: base.sync portable parker and protocol model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: ci

      - name: base.sync with the portable parker
        run: dub test :base -c unittest-portable -- -i 'sync\.'

      - name: TLA+ protocol model
        run: nix shell --inputs-from . nixpkgs#tlaplus18 nixpkgs#jdk21_headless --command sh libs/base/tla/sync/check.sh

      # Oracle 9's x86-64 control: the real primitives show no stale read.
      - name: base.sync litmus tests
        run: dub run --single --temp-build libs/base/tools/check-sync-litmus.d

      # Oracle 11: the uncontended lock and unlock compile to one atomic
      # read–modify–write and no call, on x86-64 and arm64.
      - name: base.sync fast-path disassembly
        run: dub run --single --temp-build libs/base/tools/check-sync-fast-path.d

      # Oracle 4: native stress under ThreadSanitizer reports nothing, and
      # every seeded fault (a relaxed release) is reported.
      - name: base.sync under ThreadSanitizer
        run: dub run --single --temp-build libs/base/tools/check-sync-tsan.d

  # The `_umtx_op` seam has no hosted runner: a FreeBSD virtual machine runs
  # base.sync's suite on every pull request, within 15 minutes (DS24; past
  # that, it moves to a nightly and on-demand schedule).
  freebsd:
    name: FreeBSD (base.sync)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: base.sync in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          usesh: true
          prepare: pkg install -y ldc dub git
          run: dub test :base --compiler=ldc2 -- -i 'sync\.'

  # Every symbol a spec's evidence column cites must exist in the tree. The
  # pre-commit hook of the same name runs it too (and so does `lint`, through
  # `prek run --all-files`), but a hook can be skipped and a lint failure
  # reads as formatting. This is the gate, named for what it checks. The
  # backlog it started with (`docs/specs/evidence-backlog.txt`) is empty, so
  # any unresolved citation fails here.
  #
  # `.#ci-minimal`, not `.#ci`: the check only reads files and runs `git
  # ls-files`, so the toolchain in `.#ci`'s closure would be 2.4 GiB of
  # nothing. For the same reason no `/nix` cache is restored.
  spec-evidence:
    name: Spec evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          use-nix-cache: false

      - name: Every cited symbol resolves
        run: nix run .#ci-minimal -- check spec-evidence

      # Same shape of check, same job: it reads the credits document and the
      # build inputs, nothing more (docs/specs/terminal/pages.md TPG14).
      - name: Every shipped component is credited
        run: nix run .#ci-minimal -- check credits

  # TC23 (docs/specs/toolchain/SPEC.md): a lock update merges only once the
  # toolchain it names is in the R2 cache, the cache of record, for every
  # host; Cachix is best effort. Three jobs keep a lock move from waiting on a
  # person for what CI can build itself.
  #
  # `pin-plan` evaluates the pin set's `toolchain-*` entries for x86_64-linux,
  # aarch64-darwin and aarch64-linux, asks R2 for each out path's narinfo, and
  # plans each one R2 lacks (`toolchain-pin-check --plan`,
  # apps/ci/src/derivation_pin_build.d). One Cachix serves is left to the
  # gate's mirror step, which copies it. Of the rest, each one whose recorded
  # build cost (its median recorded build on refs/perf/data, against the
  # budget in ci/placements.json) fits a job, or that has no
  # recorded cost, is built by `pin-build` on a runner of its system; one over
  # budget, and one whose closure needs it, is reported with the command that
  # builds it on a developer host. A pull request that leaves the toolchain
  # alone plans nothing, at one HEAD request per output.
  pin-plan:
    name: Toolchain build plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          use-nix-cache: false

      - name: Plan the builds of missing toolchain outputs
        id: plan
        run: |
          # Each pin's cost is the median of its recorded builds on refs/perf/data.
          nix run .#ci-minimal -- cache pin-costs "$RUNNER_TEMP/pin-costs.json"
          nix run .#toolchain-pin-check -- --plan --costs "$RUNNER_TEMP/pin-costs.json" \
            --github-output "$GITHUB_OUTPUT"

  # Builds what `pin-plan` found missing, one job per system, and pushes each
  # finished derivation to R2 as it completes (ci/with-cache.sh), so a job
  # that hits its limit keeps its progress and a re-run resumes. Without the
  # R2 secrets (a fork's pull request) it builds and pushes nothing, and the
  # gate stays red. The step summary records the build's wall clock, the
  # figure each pin's next cost comes from, through its run record.
  pin-build:
    name: Toolchain build (${{ matrix.system }})
    needs: pin-plan
    if: needs.pin-plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pin-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          use-nix-cache: false

      - name: Build & push ${{ matrix.pins }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIX_R2_SIGNING_KEY: ${{ secrets.NIX_R2_SIGNING_KEY }}
          INSTALLABLES: ${{ matrix.installables }}
          PINS: ${{ matrix.pins }}
          SYSTEM: ${{ matrix.system }}
        run: |
          # One pin at a time, each recorded as its own task: its wall time is
          # the cost the next plan reads. A pin built after another that shares
          # its dependencies is cheaper, so a cost is an upper bound.
          read -ra installables <<< "$INSTALLABLES"
          read -ra pins <<< "$PINS"
          for i in "${!installables[@]}"; do
            start=$SECONDS
            nix run .#ci-minimal -- perf record "pin-build:${pins[$i]}" \
              --placement "pin-build-$SYSTEM" -- \
              ci/with-cache.sh nix build --no-link --print-build-logs "${installables[$i]}"
            printf '%s on %s: built in %d min\n' "${pins[$i]}" "$RUNNER_OS/$RUNNER_ARCH" \
              $(((SECONDS - start + 59) / 60)) >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the run records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-records-pin-build-${{ strategy.job-index }}
          path: ~/.cache/sparkles/perf/runs
          if-no-files-found: ignore
          retention-days: 30

  # The gate. It runs after the builds, whether they built, failed or were
  # skipped, and asks R2 again; it builds nothing and needs no token.
  #
  # Before it, when the R2 secrets are present, the job mirrors into R2 every
  # toolchain output R2 lacks (ci/push-pin-set-r2.sh): a flake input's source,
  # which is fetched rather than built, and a pinned output Cachix holds.
  # Cachix holds the pins but evicts what is not pinned — the LLVM fork's
  # 2.3 GiB source was, and failed this gate on main — and R2 does not evict.
  # The first mirror moves gigabytes; after that each output costs one HEAD
  # request.
  pin-cache:
    name: Toolchain cached
    needs: [pin-plan, pin-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          use-nix-cache: false

      - name: Mirror the toolchain into the R2 cache
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NIX_R2_SIGNING_KEY: ${{ secrets.NIX_R2_SIGNING_KEY }}
        run: ci/push-pin-set-r2.sh

      - name: Every pinned toolchain output is in the cache
        run: nix run .#toolchain-pin-check

  ci:
    name: CI
    needs:
      - placements
      - test
      - platform
      - slow-tests-list
      - slow-tests
      - extracted-tests
      - sanitize
      - nix-build
      - nix-build-android
      - static-apps
      - shader-reproducibility
      - lint
      - docs
      - cloud-env
      - spec-evidence
      - pin-plan
      - pin-build
      - pin-cache
      - text-conformance
      - nix-wasm
      - sync
      - freebsd
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded or was skipped
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$r'"; exit 1 ;;
            esac
          done
