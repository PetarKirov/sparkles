# Generated from nix/ci/workflows/main-checks.nix — do not edit by hand.
# Regenerate with `nix run .#render-workflows` (also a pre-commit hook).
name: Main branch checks
"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        default: true
        description: Report the decision without filing checks or rebuilding
        required: false
        type: boolean
      sha:
        description: "Commit to mirror onto (default: the branch tip)"
        required: false
        type: string
permissions:
  checks: write
  contents: read
concurrency:
  cancel-in-progress: false
  group: "main-checks-${{ github.ref }}"
jobs:
  mirror:
    name: "Mirror the pull request's checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mirrored: "${{ steps.mirror.outputs.mirrored }}"
    defaults:
      run:
        shell: "/nix/store/90nk33c4fkyg4x4dfk5cykqiryf2nlqq-bash-interactive-5.3p15/bin/bash --noprofile --norc -eo pipefail {0}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://sparkles.cachix.org https://dlang-community.cachix.org
            extra-trusted-public-keys = sparkles.cachix.org-1:CPQ+GG8UKQCNUyvCrgZj8p7P+7cYqpjmGAmUPlLwbZc= dlang-community.cachix.org-1:eAX1RqX4PjTDPCAp/TvcZP+DYBco2nJBackkAJ2BsDQ=
            fallback = true
            connect-timeout = 5
            download-attempts = 2
            auto-optimise-store = false
          github_access_token: "${{ github.token }}"
      - name: "Realise the job's closure"
        shell: bash
        run: |
          set -euo pipefail
          bundle=/nix/store/axl7fvn78gjmcgsb33wh6c7b8syjl7ri-ci-job-mirror
          nix=/nix/var/nix/profiles/default/bin
          if "$nix/nix-store" --realise "$bundle" > /dev/null 2>&1; then
            echo "Substituted $bundle"
            exit 0
          fi
          echo "::group::Building the job's closure (not in the binary cache yet)"
          built=$("$nix/nix" build --no-link --print-out-paths -L '.#ci.bundles.main-checks.mirror')
          echo "::endgroup::"
          if [ "$built" != "$bundle" ]; then
            echo "::error::.github/workflows is stale: it names $bundle, the flake builds $built. Run: nix run .#render-workflows"
            exit 1
          fi
      - name: "Mirror, if the landed tree is the tree that was built"
        id: mirror
        env:
          DRY_RUN: "${{ inputs.dry_run && '--dry-run' || '' }}"
          GITHUB_TOKEN: "${{ github.token }}"
          SHA: "${{ inputs.sha || github.sha }}"
        run: /nix/store/q0ccwhbzqiyngcjw5774v4p1zzafclh0-ci-mirror-checks/bin/ci-mirror-checks
  rebuild:
    name: Build the commit for real
    needs:
      - mirror
    if: "${{ needs.mirror.outputs.mirrored != 'true' && !inputs.dry_run }}"
    uses: ./.github/workflows/ci.yml
    secrets: inherit
