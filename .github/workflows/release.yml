name: Release
"on":
  release:
    types:
      - published
  workflow_dispatch: {}
concurrency:
  cancel-in-progress: false
  group: "release-${{ github.ref }}"
jobs:
  nix-build-pin-aarch64-darwin:
    name: "Nix build, push & pin (aarch64-darwin)"
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: "/nix/store/gdbxd0zh7a4ag9b880wabjb87pzb5pgg-bash-interactive-5.3p15/bin/bash --noprofile --norc -eo pipefail {0}"
    env:
      CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      CACHIX_CACHE: sparkles
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://sparkles.cachix.org https://dlang-community.cachix.org
            extra-trusted-public-keys = sparkles.cachix.org-1:CPQ+GG8UKQCNUyvCrgZj8p7P+7cYqpjmGAmUPlLwbZc= dlang-community.cachix.org-1:eAX1RqX4PjTDPCAp/TvcZP+DYBco2nJBackkAJ2BsDQ=
            fallback = true
            connect-timeout = 5
            download-attempts = 2
            auto-optimise-store = false
          github_access_token: "${{ github.token }}"
      - name: Use the project cache
        uses: cachix/cachix-action@v17
        with:
          name: sparkles
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: "Realise the job's closure"
        shell: bash
        run: |
          set -euo pipefail
          nix=/nix/var/nix/profiles/default/bin
          attr='.#ci.bundles.release.nix-build-pin-aarch64-darwin'
          bundle=$("$nix/nix" eval --raw "$attr.outPath")
          if "$nix/nix-store" --realise "$bundle" > /dev/null 2>&1; then
            echo "Substituted $bundle"
          else
            echo "::group::Building the job's closure (not in the binary cache yet)"
            built=$("$nix/nix" build --no-link --print-out-paths -L "$attr")
            echo "::endgroup::"
            if [ "$built" != "$bundle" ]; then
              echo "::error::the bundle resolved to $bundle, but the flake builds $built (an impure evaluation?)"
              exit 1
            fi
          fi
          echo "CI_BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: "Build and push .#all-desktop"
        run: "$CI_BUNDLE/bin/01-ci-with-cachix nix build --print-build-logs .#all-desktop"
      - name: "Push & pin the release closure"
        env:
          CI_SYSTEM: aarch64-darwin
        run: "$CI_BUNDLE/bin/02-ci-release-pin"
