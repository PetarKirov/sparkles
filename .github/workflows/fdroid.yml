name: F-Droid

# Builds the release APK for a tag and pushes it to the binary cache. It does
# NOT sign or publish: the signing keys live on hardware tokens that a
# GitHub-hosted runner cannot reach, so signing and publication happen on the
# maintainer's workstation. See docs/specs/hue/fdroid.md.
#
# The split is the point, not a workaround. No signing key material — not a
# passphrase, not a base64 keystore — exists anywhere in this workflow or in
# this repository's secrets, so a compromised runner or a leaked Actions token
# cannot produce something users would install.
#
# What connects the halves is the store path. This job builds a *pure*
# derivation and pushes it to Cachix; the workstation evaluates the same
# expression, gets the same path, and substitutes the bytes instead of
# repeating a ~90-minute cross build. `fdroid-publish` refuses to build the APK
# locally by default, so an accidental local rebuild cannot quietly replace
# what CI produced.
on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.4.0)
        required: true
        type: string

concurrency:
  group: fdroid-build-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the unsigned release APK
    if: github.repository == 'PetarKirov/sparkles'
    # x86_64-linux is the only host the NDK and SDK exist for.
    runs-on: ubuntu-latest
    # A cold cross closure (dual-ABI druntimes, raylib/tree-sitter/ghostty,
    # every grammar, the Maple font build) is the same shape as
    # nix-build-android's.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          push-to-cache: true
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          use-nix-cache: true
          # Share the Android job's cache key: this builds the same closure.
          nix-cache-key: nix-${{ runner.os }}-nixandroid-${{ hashFiles('**/flake.lock') }}
          nix-cache-restore-prefixes: |
            nix-${{ runner.os }}-nixandroid-
            nix-${{ runner.os }}-

      # `--no-require-cached` because this job is the thing that fills the
      # cache; the default (refuse to build locally) is for the signing machine.
      - name: Build and push
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          ci/with-cachix.sh nix run .#fdroid-publish -- publish \
            --tag "$TAG" \
            --stage build \
            --no-require-cached \
            --workdir "$RUNNER_TEMP/fdroid-build"

      # The store path is the handoff. Printing it here lets the maintainer
      # confirm the workstation resolved the same derivation before signing —
      # if the two differ, the local tree is not what CI built.
      - name: Report the handoff
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          path=$(nix run .#fdroid-publish -- path --tag "$TAG")
          {
            echo "## Ready to sign"
            echo
            echo '```console'
            echo "\$ nix run .#fdroid-publish -- publish --tag $TAG --stage deploy"
            echo '```'
            echo
            echo "Expected store path — the workstation must resolve the same one,"
            echo "or it is about to sign something other than what was built here:"
            echo
            echo "    $path"
          } >> "$GITHUB_STEP_SUMMARY"
