name: F-Droid
"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.4.0)
        required: true
        type: string
concurrency:
  cancel-in-progress: false
  group: "fdroid-build-${{ github.event.release.tag_name || inputs.tag }}"
jobs:
  build:
    name: Build the unsigned release APK
    if: "${{ github.repository == 'PetarKirov/sparkles' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: "/nix/store/90nk33c4fkyg4x4dfk5cykqiryf2nlqq-bash-interactive-5.3p15/bin/bash --noprofile --norc -eo pipefail {0}"
    env:
      CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      CACHIX_CACHE: sparkles
      TAG: "${{ github.event.release.tag_name || inputs.tag }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://sparkles.cachix.org https://dlang-community.cachix.org
            extra-trusted-public-keys = sparkles.cachix.org-1:CPQ+GG8UKQCNUyvCrgZj8p7P+7cYqpjmGAmUPlLwbZc= dlang-community.cachix.org-1:eAX1RqX4PjTDPCAp/TvcZP+DYBco2nJBackkAJ2BsDQ=
            fallback = true
            connect-timeout = 5
            download-attempts = 2
            auto-optimise-store = false
          github_access_token: "${{ github.token }}"
      - name: Use the project cache
        uses: cachix/cachix-action@v17
        with:
          name: sparkles
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: "Realise the job's closure"
        shell: bash
        run: |
          set -euo pipefail
          nix=/nix/var/nix/profiles/default/bin
          attr='.#ci.bundles.fdroid.build'
          bundle=$("$nix/nix" eval --raw "$attr.outPath")
          if "$nix/nix-store" --realise "$bundle" > /dev/null 2>&1; then
            echo "Substituted $bundle"
          else
            echo "::group::Building the job's closure (not in the binary cache yet)"
            built=$("$nix/nix" build --no-link --print-out-paths -L "$attr")
            echo "::endgroup::"
            if [ "$built" != "$bundle" ]; then
              echo "::error::the bundle resolved to $bundle, but the flake builds $built (an impure evaluation?)"
              exit 1
            fi
          fi
          echo "CI_BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Build and push
        run: "$CI_BUNDLE/bin/01-ci-with-cachix nix run .#release -- publish --tag \"$TAG\" --stage build --no-require-cached --workdir \"$RUNNER_TEMP/fdroid-build\""
      - name: Pin the unsigned APK
        run: "$CI_BUNDLE/bin/02-ci-fdroid-pin"
      - name: Report the handoff
        run: "$CI_BUNDLE/bin/03-ci-fdroid-handoff"
