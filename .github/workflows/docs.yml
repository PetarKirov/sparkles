# Generated from nix/ci/workflows/docs.nix — do not edit by hand.
# Regenerate with `nix run .#render-workflows` (also a pre-commit hook).
name: Deploy Docs
"on":
  pull_request:
    paths:
      - "docs/**"
      - "libs/twoslash/**"
      - package.json
      - yarn.lock
      - .yarnrc.yml
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "libs/twoslash/**"
      - package.json
      - yarn.lock
      - .yarnrc.yml
  workflow_dispatch: {}
concurrency:
  cancel-in-progress: true
  group: "docs-${{ github.ref }}"
jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    defaults:
      run:
        shell: "/nix/store/90nk33c4fkyg4x4dfk5cykqiryf2nlqq-bash-interactive-5.3p15/bin/bash --noprofile --norc -eo pipefail {0}"
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://sparkles.cachix.org https://dlang-community.cachix.org
            extra-trusted-public-keys = sparkles.cachix.org-1:CPQ+GG8UKQCNUyvCrgZj8p7P+7cYqpjmGAmUPlLwbZc= dlang-community.cachix.org-1:eAX1RqX4PjTDPCAp/TvcZP+DYBco2nJBackkAJ2BsDQ=
            fallback = true
            connect-timeout = 5
            download-attempts = 2
            auto-optimise-store = false
          github_access_token: "${{ github.token }}"
      - name: Use the project cache
        uses: cachix/cachix-action@v17
        with:
          name: sparkles
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: "Realise the job's closure"
        shell: bash
        run: |
          set -euo pipefail
          nix=/nix/var/nix/profiles/default/bin
          attr='.#ci.bundles.docs.deploy'
          bundle=$("$nix/nix" eval --raw "$attr.outPath")
          if "$nix/nix-store" --realise "$bundle" > /dev/null 2>&1; then
            echo "Substituted $bundle"
          else
            echo "::group::Building the job's closure (not in the binary cache yet)"
            built=$("$nix/nix" build --no-link --print-out-paths -L "$attr")
            echo "::endgroup::"
            if [ "$built" != "$bundle" ]; then
              echo "::error::the bundle resolved to $bundle, but the flake builds $built (an impure evaluation?)"
              exit 1
            fi
          fi
          echo "CI_BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          key: "yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}"
          path: "~/.yarn/berry/cache"
          restore-keys: "yarn-${{ runner.os }}-"
      - name: Refresh the merge badges
        continue-on-error: true
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "$CI_BUNDLE/bin/02-ci-merge-badges"
      - name: Build the VitePress site
        run: "$CI_BUNDLE/bin/03-ci-docs-build"
      - name: "Deploy to Cloudflare Pages & comment the preview URL"
        env:
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          GITHUB_TOKEN: "${{ github.token }}"
        run: "$CI_BUNDLE/bin/04-ci-deploy-cloudflare-pages"
