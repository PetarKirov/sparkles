      - name: Check every link
        id: sweep
        continue-on-error: true
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: /nix/store/l7z65wnrmwhz3pr0paslpjmmljss24lc-ci-link-sweep/bin/ci-link-sweep
