            fallback = true
            connect-timeout = 5
            download-attempts = 2
            auto-optimise-store = false
          github_access_token: "${{ github.token }}"
      - name: Use the project cache
        uses: cachix/cachix-action@v17
        with:
          name: sparkles
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: "Realise the job's closure"
        shell: bash
