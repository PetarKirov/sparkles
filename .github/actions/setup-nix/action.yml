name: Setup Nix
description: Installs Nix, configures binary caches, and optionally builds/activates a development environment using direnv or a specific Nix devShell.

inputs:
  push-to-cache:
    description: Whether to use cachix or not
    type: boolean
    required: false
    default: false
  cachix-cache:
    description: The name of the cachix cache to use
    required: false
    default: ''
  cachix-auth-token:
    description: Cachix auth token
    required: false
    default: ''
  trusted-public-keys:
    description: Trusted public keys
    required: false
    default: ''
  substituters:
    description: Substituters
    required: false
    default: ''
  nix-github-token:
    description: GitHub token to add as access-token in nix.conf
    default: ''
    required: false
  nix-gitlab-token:
    description: GitLab token to add as access-token in nix.conf
    default: ''
    required: false
  nix-gitlab-domain:
    description: GitLab domain to add as access-token in nix.conf
    default: 'gitlab.com'
    required: false
  nix-version:
    description: Nix version to install
    default: ''
    required: false
  use-direnv:
    description: Whether to use direnv to load the environment
    type: boolean
    required: false
    default: false
  devshell:
    description: The name of the devShell to build and export to GITHUB_ENV (e.g. 'default' for .#devShells.default)
    required: false
    default: ''
  use-nix-cache:
    description: Whether to use nix-community/cache-nix-action to cache /nix/store in GHA (opt-in)
    type: boolean
    required: false
    default: false
  nix-cache-key:
    description: The primary key to use for the Nix GHA cache
    required: false
    default: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
  nix-cache-restore-prefixes:
    description: The fallback restore prefixes for the Nix GHA cache
    required: false
    default: |
      nix-${{ runner.os }}-

runs:
  using: 'composite'
  steps:
    - name: Log GH API rate limits
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        echo "::group::GH API rate limits"
        gh api /rate_limit | jq || true
        echo "::endgroup::"

    - name: Check if Nix is available
      id: check-nix
      shell: bash
      run: |
        if command -v nix &>/dev/null; then
          echo "has_nix=true" >> "$GITHUB_OUTPUT"
          echo "Nix is already installed: $(nix --version)"
        else
          echo "has_nix=false" >> "$GITHUB_OUTPUT"
          echo "Nix is not installed, will install it"
        fi

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      if: steps.check-nix.outputs.has_nix != 'true'
      with:
        install_url: ${{ inputs.nix-version != '' && format('https://releases.nixos.org/nix/nix-{0}/install', inputs.nix-version) || '' }}
        extra_nix_config: |
          auto-optimise-store = false

    # Shared with CircleCI — see ci/README.md. The inputs are mapped onto the
    # provider-neutral environment contract here rather than being read from
    # `inputs.*` inside the script, which is the whole reason one script can
    # serve both providers.
    - name: Configure Nix
      shell: bash
      env:
        NIX_SUBSTITUTERS: ${{ inputs.substituters }}
        NIX_TRUSTED_PUBLIC_KEYS: ${{ inputs.trusted-public-keys }}
        NIX_GITHUB_TOKEN: ${{ inputs.nix-github-token }}
        NIX_GITLAB_TOKEN: ${{ inputs.nix-gitlab-token }}
        NIX_GITLAB_DOMAIN: ${{ inputs.nix-gitlab-domain }}
        CACHIX_CACHE: ${{ inputs.cachix-cache }}
        CACHIX_AUTH_TOKEN: ${{ inputs.cachix-auth-token }}
      run: ci/nix-configure.sh

    - uses: cachix/cachix-action@v15
      if: ${{ fromJSON(inputs.push-to-cache || 'false') && inputs.cachix-cache != '' && inputs.cachix-auth-token != '' }}
      with:
        name: ${{ inputs.cachix-cache }}
        authToken: ${{ inputs.cachix-auth-token }}

    - name: Restore/Save Nix Store GHA Cache
      uses: nix-community/cache-nix-action@v7
      if: ${{ fromJSON(inputs.use-nix-cache || 'false') }}
      with:
        primary-key: ${{ inputs.nix-cache-key }}
        restore-prefixes-first-match: ${{ inputs.nix-cache-restore-prefixes }}

    # Resolve, build and activate the devShell. Shared with CircleCI — see
    # ci/README.md.
    #
    # The script builds the devShell explicitly before handing over to direnv,
    # because direnv's `use flake` swallows build failures: it runs
    # `eval "$(nix print-dev-env ...)"`, so a devShell that fails to build
    # substitutes to the empty string, `eval ""` succeeds, and the export still
    # exits 0 — leaving $GITHUB_ENV without the devShell's PATH and the real
    # failure surfacing several steps later as `<tool>: command not found`.
    - name: Build & activate the Nix DevShell
      if: ${{ fromJSON(inputs.use-direnv || 'false') || inputs.devshell != '' }}
      shell: bash
      env:
        CI_DEVSHELL: ${{ inputs.devshell }}
        CI_USE_DIRENV: ${{ inputs.use-direnv }}
      run: ci/nix-devshell.sh
