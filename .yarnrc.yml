# Plug'n'Play is Yarn's default linker. This install stays on node_modules:
# VitePress, mermaid, and wrangler resolve optional native addons through it,
# and the docs deploy runs wrangler as a project binary.
nodeLinker: node-modules

# npm runs dependency lifecycle scripts. Yarn 4 does not, which leaves
# esbuild, sharp, and workerd without their platform binaries.
enableScripts: true
