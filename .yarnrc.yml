# Yarn 4's default. Native packages (esbuild, sharp, workerd) are unplugged
# into .yarn/unplugged so their install scripts still see a real directory.
nodeLinker: pnp

# npm runs dependency lifecycle scripts. Yarn 4 does not, which leaves
# esbuild, sharp, and workerd without their platform binaries.
enableScripts: true

# Package archives live in the system cache (~/.yarn/berry/cache on Linux),
# shared across checkouts. A home-directory .yarnrc.yml cannot turn this off.
enableGlobalCache: true
