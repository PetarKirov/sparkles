# Lychee link checker configuration
# https://lychee.cli.rs/#/usage/config

#############################  Cache  ###############################
cache = true

# Discard cached results older than this duration
max_cache_age = "14d"

# Don't cache transient failures (rate limits, server errors)
cache_exclude_status = [401, 403, 429, "500.."]

#############################  Requests  ############################

# Timeout per request (seconds). Kept generous for two distinct reasons — both
# about links that are LIVE, which is why a tight timeout produces false errors:
#
#  1. Slow to ANSWER. Some doc hosts behind Cloudflare (e.g. docs.appimage.org)
#     or GitHub Pages answer a browser in <0.5s but stall a bot request for
#     several seconds before the challenge clears.
#
#  2. Slow to TRANSFER. lychee reads the response body, so the timeout covers
#     the download — and a link can point at something large. The measured case:
#     nick-black.com/htp-notcurses.pdf answers in 0.38s and is 27.8 MB, so on a
#     runner sharing bandwidth 16 ways it timed out at 20s while being perfectly
#     reachable (the run reported "0 Errors, 1 Timeout" and still failed).
#
# Case 2 is why this is a timeout bump rather than a per-host `request_interval`
# like the blocks below: pacing requests does not make a 27 MB file smaller. The
# cost is bounded — only genuinely slow requests use the extra budget, and the
# run is ~16 min against a 35 min cap.
timeout = 45

# Present as a real browser. Cloudflare / ReadTheDocs-fronted hosts bot-score the
# default `lychee/<ver>` agent and slow-walk or challenge it (manifesting as a
# request timeout in CI, while curl with a browser UA gets 200 immediately). This
# does NOT help hosts that refuse at the TCP layer — see web.archive.org below.
user_agent = "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"

# Reduce concurrent requests in CI to avoid rate limits and connection resets
max_concurrency = 16

# Maximum number of retries per request
max_retries = 2

# Wait time in seconds between retries (helps with rate-limited servers)
retry_wait_time = 2

# Resolve cross-referenced files that omit their extension
fallback_extensions = ["md", "html"]

# Skip the repo-root AGENTS.md symlink. It points at docs/guidelines/AGENTS.md
# (the canonical copy, which IS checked and passes), but its relative links are
# authored for docs/guidelines/; resolved from the repo root they yield false
# "file not found" errors. Regex-matched against the input path; anchored so it
# does not also exclude docs/guidelines/AGENTS.md.
exclude_path = [
    '^AGENTS\.md$',
    '^docs/research/.*/grounding/',
]

# Don't check URLs inside code blocks (they're often illustrative, not real)
include_verbatim = false

# Don't check fragments within URLs (lychee >= 0.24 takes an enum here:
# none|anchor-only|text-only|full; "none" replaces the old boolean `false`)
include_fragments = "none"

# When a link is broken, suggest replacements from web archives
suggest = true

# Root directory to use when checking absolute links in local files.
# Resolved against the current working directory.
root_dir = "."

# Show interactive progress bar
no_progress = false

# Rewrite GitHub blob/tree URLs to avoid rate limits and auth issues.
# Remap only PetarKirov/sparkles links to the Contents API (where we have valid authentication token)
# Remap other public repositories' files to raw.githubusercontent.com to avoid API rate limits and 401 auth issues
remap = [
    "https://github\\.com/PetarKirov/sparkles/blob/([^/]+)/(.*) https://api.github.com/repos/PetarKirov/sparkles/contents/$2?ref=$1",
    "https://github\\.com/PetarKirov/sparkles/tree/([^/]+)/(.*) https://api.github.com/repos/PetarKirov/sparkles/contents/$2?ref=$1",
    "https://github\\.com/([^/]+)/([^/]+)/blob/([^/]+)/(.*) https://raw.githubusercontent.com/$1/$2/$3/$4",
]

#############################  Hosts  ###############################

# NOTE: per-host `[hosts."…"]` throttling is silently ignored by lychee <= 0.21
# (it only landed later — verified working on 0.24.2). Keep lychee recent or these
# blocks become no-ops.

# Throttle requests to github.com to reduce rate limiting
[hosts."github.com"]
request_interval = "1s"

[hosts."api.github.com"]
request_interval = "200ms"

# The `github.com` throttle above does NOT cover most GitHub links: the remap
# rewrites every non-sparkles `/blob/` URL to raw.githubusercontent.com, and
# lychee applies host throttling to the RESOLVED host. That left ~3.3k links
# hitting an unthrottled host 16-at-a-time (`max_concurrency`), which earns a
# burst of 429s that `max_retries = 2` at 2 s apart does not outlast.
#
# 100 ms rather than the 1 s used for github.com: at ~3.3k links a 1 s pace
# would serialize this host into ~55 min and blow the job's 35 min budget,
# whereas 100 ms costs ~5.5 min against a run that already takes ~19.
[hosts."raw.githubusercontent.com"]
request_interval = "100ms"

[hosts."gitlab.freedesktop.org"]
request_interval = "1s"

# nick-black.com and notcurses.com are ONE server (both 173.230.130.29), and one
# of them serves a 27.8 MB PDF. That combination starves the other: notcurses.com
# is a 6.7 KB page answering in 0.7s to a single client, yet it timed out in CI
# while the PDF was being pulled alongside it.
#
# Worth generalising, because it is a hole in the strategy below: lychee paces
# per HOSTNAME, but the bottleneck is the SERVER. Two names resolving to one
# address get twice the intended concurrency, and no single `[hosts."…"]` block
# can see that. Pacing BOTH names is the available approximation — so when a
# throttle does not seem to help, check whether the host shares an IP with
# another one we link.
[hosts."nick-black.com"]
request_interval = "1s"

[hosts."notcurses.com"]
request_interval = "1s"

# ── A recognised class, not a series of one-offs ────────────────────────────
#
# Every per-host block below exists for ONE reason: `max_concurrency = 16`
# against a small documentation host that answers a single client instantly but
# drops or stalls a burst from one IP. Each was probed directly before being
# added (HTTP 200 in <0.5 s) — none of them is rot, and replacing the links with
# archive.org copies would have been wrong twice over, since CI excludes
# web.archive.org and those references would then go unchecked.
#
# Per-host throttles rather than a lower global concurrency: the failures are
# always a small host we link 10–20 times, while the large hosts (github,
# docs.rs, crates.io) handle 16 fine. Halving `max_concurrency` would slow the
# whole 8.5k-link run to fix a handful of hosts, and the run already takes
# ~16 min against a 35 min cap.
#
# The diagnostic trap: a connection-level failure is not covered by
# `cache_exclude_status`, so ONE unreachable URL is reported as an error at
# EVERY reference. Enumerate distinct URLs before believing an error count.

# Small, long-lived documentation sites that answer a single client instantly
# (both measured at HTTP 200 in <0.5 s) but drop or stall connections when 16
# arrive at once from one runner IP. The symptom is misleading: the first probe
# fails, lychee caches it, and every later reference reports `Error (cached)` —
# so ONE unreachable URL became 15 "errors" plus 6 timeouts in a single run and
# read like link rot. It is not; the links are live.
#
# 12 unique tronche.com URLs and 3 juce.com, so pacing them costs ~15 s.
[hosts."tronche.com"]
request_interval = "1s"

[hosts."juce.com"]
request_interval = "1s"

# 20 links, 503 under burst, 200 in 0.31 s to a single client.
[hosts."sean-parent.stlab.cc"]
request_interval = "1s"

# The C++ committee papers server is simply slow: it answers, but several
# concurrent requests push past the 20 s `timeout` and lychee counts a timeout
# as a failure even when the error count is zero. Only 6 links point here, so
# one-at-a-time costs ~6 s against a 16 min run — the same trade as
# web.archive.org below, for the same reason.
[hosts."www.open-std.org"]
request_interval = "1s"

# web.archive.org refuses *connections* (TCP-level "Connection refused", which is
# never retried) once an IP opens too many at once; it recovers in tens of seconds.
# A custom user_agent does not help — the refusal happens before any header is sent.
# Pacing requests one-at-a-time is the only fix that works. (CI excludes this host
# entirely via lychee.ci.exclude, so this throttle benefits local pre-commit runs.)
[hosts."web.archive.org"]
request_interval = "1s"

# SourceForge hosts block the synthetic Firefox User-Agent (returning HTTP 403
# Cloudflare challenge) but respond with HTTP 200 OK to standard HTTP client
# user agents like curl.
[hosts."sourceforge.net"]
headers = { "User-Agent" = "curl/8.7.1" }

[hosts."sourceforge.io"]
headers = { "User-Agent" = "curl/8.7.1" }

[hosts."asymptote.sourceforge.io"]
headers = { "User-Agent" = "curl/8.7.1" }

[hosts."aegis.sourceforge.net"]
headers = { "User-Agent" = "curl/8.7.1" }

[hosts."docutils.sourceforge.io"]
headers = { "User-Agent" = "curl/8.7.1" }

[hosts."defoe.sourceforge.net"]
headers = { "User-Agent" = "curl/8.7.1" }

# code.haverbeke.berlin rejects the synthetic Firefox User-Agent with HTTP 403,
# but responds with HTTP 200 to curl.
[hosts."code.haverbeke.berlin"]
headers = { "User-Agent" = "curl/8.7.1" }
