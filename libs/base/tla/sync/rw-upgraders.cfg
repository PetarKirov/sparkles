\* S3 RwLock: two upgradable waiters and a reader; one upgrades. A release of
\* upgradable mode admits the next upgradable waiter (SYR7).
CONSTANTS
  Procs = {p1, p2, p3}
  Kind = "rwlock"
  Permits = 1
  Readers = {p1}
  Writers = {}
  Upgraders = {p2, p3}
  Upgrading = {p2}
  Timed = {}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK SemBalance NoStrandedPermit ParkedBit MutualExclusion WordMatches
PROPERTY Acquires
