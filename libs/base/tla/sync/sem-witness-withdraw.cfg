\* must be violated (the model admits withdrawal).
CONSTANTS
  Procs = {p1, p2}
  Kind = "semaphore"
  Permits = 1
  Readers = {}
  Writers = {}
  Upgraders = {}
  Upgrading = {}
  Timed = {p2}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANT NoWithdrawal
