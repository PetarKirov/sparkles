\* S3 Semaphore seeded fault: a timeout that loses to a handoff drops the
\* permit (SYS4); SemBalance must be violated.
CONSTANTS
  Procs = {p1, p2}
  Kind = "semaphore"
  Permits = 1
  Readers = {}
  Writers = {}
  Upgraders = {}
  Upgrading = {}
  Timed = {p2}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = TRUE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK SemBalance NoStrandedPermit ParkedBit MutualExclusion WordMatches
