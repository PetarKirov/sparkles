\* S3 RwLock seeded starvation fault: shared acquirers ignore the parked bit
\* (SYR3), so readers keep a parked writer out forever; Acquires must be
\* violated.
CONSTANTS
  Procs = {p1, p2, p3, p4}
  Kind = "rwlock"
  Permits = 1
  Readers = {p1, p2}
  Writers = {p3}
  Upgraders = {p4}
  Upgrading = {}
  Timed = {}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = TRUE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
PROPERTY Acquires
