\* Seeded fault (expected to FAIL with WaitReturn violated): the condition
\* reacquires an InterruptibleMutex interruptibly, so a cancelled wait can
\* return without the lock (SYC3).
CONSTANTS
  Procs = {p1, p2, p3}
  Kind = "imutex"
  Lockers = {}
  CondWaiters = {p1, p2}
  Notifiers = {p3}
  Timed = {}
  Interruptible = {p1, p2}
  StarvationBound = 1
  EnableFork = FALSE
  EnableSpurious = TRUE
  FaultNoHandoff = FALSE
  FaultPureValidate = FALSE
  FaultNoPassOn = FALSE
  FaultTwoDesignated = FALSE
  FaultCancelBeatsGrant = FALSE
  FaultInterruptibleReacquire = TRUE
SPECIFICATION Spec
INVARIANT WaitReturn
