  Lockers = {p1, p2}
  CondWaiters = {}
  Notifiers = {}
  Timed = {}
  Interruptible = {}
  StarvationBound = 1
  EnableFork = FALSE
  EnableSpurious = TRUE
  FaultNoHandoff = FALSE
  FaultPureValidate = TRUE
  FaultNoPassOn = FALSE
  FaultTwoDesignated = FALSE
  FaultCancelBeatsGrant = FALSE
  FaultInterruptibleReacquire = FALSE
