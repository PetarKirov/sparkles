\* S1: filtered unparks (SYP9): every wake, skip and stop answer of the
\* filter, with deadlines and cancellation.
CONSTANTS
  Procs = {p1, p2, p3}
  Waiters = {p1, p2}
  Wakers = {p3}
  Timed = {p1}
  Interruptible = {p2}
  NKeys = 1
  WaitKeys = {1}
  SharedBucket = TRUE
  EnableReset = TRUE
  EnableKick = FALSE
  EnableFilter = TRUE
  EnableRequeue = FALSE
  EnableFork = FALSE
  FaultValidateOutsideLock = FALSE
  FaultTimeoutIgnoresToken = FALSE
  FaultDeliverThroughRecord = FALSE
  FaultNoRetire = FALSE
  FaultSettleOnSpurious = FALSE
  FaultRequeueKeepsMode = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK QueueConsistent TagsConsistent NoLostWakeup ReturnConsistent
  SettleOnlyOnCancel RegistrationsSound BucketsHeldByHolders
