\* S3 RwLock witness: a writer withdraws by its deadline; NoWithdrawal must
\* be violated.
CONSTANTS
  Procs = {p1, p2}
  Kind = "rwlock"
  Permits = 1
  Readers = {p1}
  Writers = {p2}
  Upgraders = {}
  Upgrading = {}
  Timed = {p2}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANT NoWithdrawal
