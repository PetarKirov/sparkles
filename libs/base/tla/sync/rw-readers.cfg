\* S3 RwLock: two readers and a writer in a loop (SYR2, SYR3): readers park
\* behind a parked writer, and every waiter acquires (SYR7).
CONSTANTS
  Procs = {p1, p2, p3}
  Kind = "rwlock"
  Permits = 1
  Readers = {p1, p2}
  Writers = {p3}
  Upgraders = {}
  Upgrading = {}
  Timed = {}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK SemBalance NoStrandedPermit ParkedBit MutualExclusion WordMatches
PROPERTY Acquires
