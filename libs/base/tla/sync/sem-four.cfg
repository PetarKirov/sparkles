\* S3 Semaphore, two permits, four threads, p4 with a deadline: the balance
\* (SYS4) and FIFO handoff (SYS3) at a larger bound.
CONSTANTS
  Procs = {p1, p2, p3, p4}
  Kind = "semaphore"
  Permits = 2
  Readers = {}
  Writers = {}
  Upgraders = {}
  Upgrading = {}
  Timed = {p4}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK SemBalance NoStrandedPermit ParkedBit MutualExclusion WordMatches
PROPERTY Acquires
