\* S3 Semaphore seeded fault: a release raises the count past parked
\* waiters instead of handing off (SYS3); NoStrandedPermit must be violated.
CONSTANTS
  Procs = {p1, p2}
  Kind = "semaphore"
  Permits = 1
  Readers = {}
  Writers = {}
  Upgraders = {}
  Upgrading = {}
  Timed = {}
  FaultRaiseCount = TRUE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK SemBalance NoStrandedPermit ParkedBit MutualExclusion WordMatches
