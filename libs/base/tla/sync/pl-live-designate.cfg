\* S1 liveness: one waiter whose parks carry a deadline and are
\* interruptible, one waker that signals, resets and designates, and one fork.
CONSTANTS
  Procs = {p1, p2}
  Waiters = {p1}
  Wakers = {p2}
  Timed = {p1}
  Interruptible = {p1}
  NKeys = 1
  WaitKeys = {1}
  SharedBucket = TRUE
  EnableReset = TRUE
  EnableKick = TRUE
  EnableFilter = FALSE
  EnableRequeue = FALSE
  EnableFork = TRUE
  FaultValidateOutsideLock = FALSE
  FaultTimeoutIgnoresToken = FALSE
  FaultDeliverThroughRecord = FALSE
  FaultNoRetire = FALSE
  FaultSettleOnSpurious = FALSE
  FaultRequeueKeepsMode = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK QueueConsistent TagsConsistent NoLostWakeup ReturnConsistent
  SettleOnlyOnCancel RegistrationsSound BucketsHeldByHolders
PROPERTIES WakesReturn RegistrationsRetire SignalsComplete
