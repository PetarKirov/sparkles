\* S3 RwLock seeded fault: a pass grants a queued writer although an
\* upgradable holder exists (SYR4); MutualExclusion must be violated.
CONSTANTS
  Procs = {p1, p2, p3}
  Kind = "rwlock"
  Permits = 1
  Readers = {}
  Writers = {p1, p2}
  Upgraders = {p3}
  Upgrading = {}
  Timed = {}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK SemBalance NoStrandedPermit ParkedBit MutualExclusion WordMatches
