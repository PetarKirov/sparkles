\* S2 Condition over a Mutex, safety: p1 waits with waitUntil, p2 with
\* waitInterruptible, p3 notifies one or all, holding the lock or not
\* (SYC1-SYC9: wait morphing onto a held lock, wake one and move the rest on
\* a free one).
CONSTANTS
  Procs = {p1, p2, p3}
  Kind = "mutex"
  Lockers = {}
  CondWaiters = {p1, p2}
  Notifiers = {p3}
  Timed = {p1}
  Interruptible = {p2}
  StarvationBound = 1
  EnableFork = FALSE
  EnableSpurious = FALSE
  FaultNoHandoff = FALSE
  FaultPureValidate = FALSE
  FaultNoPassOn = FALSE
  FaultTwoDesignated = FALSE
  FaultCancelBeatsGrant = FALSE
  FaultInterruptibleReacquire = FALSE
SPECIFICATION Spec
INVARIANTS
  MutualExclusion QueueConsistent Designation ParkedBit ConditionBit
  HandoffAtHead HandoffLockNeverFreeWithWaiters NoLostWakeup WaitReturn
  SettleOnce HeldStaysHeld
