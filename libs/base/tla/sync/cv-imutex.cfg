\* S2 Condition over an InterruptibleMutex, safety: as cv-mutex; a free
\* handoff lock is acquired for the woken waiter (SYC6), and reacquisition is
\* never interruptible (SYC3, SYJ1).
CONSTANTS
  Procs = {p1, p2, p3}
  Kind = "imutex"
  Lockers = {}
  CondWaiters = {p1, p2}
  Notifiers = {p3}
  Timed = {p1}
  Interruptible = {p2}
  StarvationBound = 1
  EnableFork = FALSE
  EnableSpurious = FALSE
  FaultNoHandoff = FALSE
  FaultPureValidate = FALSE
  FaultNoPassOn = FALSE
  FaultTwoDesignated = FALSE
  FaultCancelBeatsGrant = FALSE
  FaultInterruptibleReacquire = FALSE
SPECIFICATION Spec
INVARIANTS
  MutualExclusion QueueConsistent Designation ParkedBit ConditionBit
  HandoffAtHead HandoffLockNeverFreeWithWaiters NoLostWakeup WaitReturn
  SettleOnce HeldStaysHeld
