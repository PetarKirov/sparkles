\* S3 RwLock seeded fault: the last reader does not wake a pending upgrade
\* (SYR7); Acquires must be violated.
CONSTANTS
  Procs = {p1, p2}
  Kind = "rwlock"
  Permits = 1
  Readers = {p1}
  Writers = {}
  Upgraders = {p2}
  Upgrading = {p2}
  Timed = {}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = TRUE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
PROPERTY Acquires
