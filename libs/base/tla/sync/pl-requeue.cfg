\* S1: requeue between two keys in two buckets (SYP8 lock order, SYP14
\* rewrite), with deadlines and cancellation racing the move.
CONSTANTS
  Procs = {p1, p2, p3}
  Waiters = {p1, p2}
  Wakers = {p3}
  Timed = {p1}
  Interruptible = {p2}
  NKeys = 2
  WaitKeys = {1}
  SharedBucket = FALSE
  EnableReset = FALSE
  EnableKick = FALSE
  EnableFilter = FALSE
  EnableRequeue = TRUE
  EnableFork = FALSE
  FaultValidateOutsideLock = FALSE
  FaultTimeoutIgnoresToken = FALSE
  FaultDeliverThroughRecord = FALSE
  FaultNoRetire = FALSE
  FaultSettleOnSpurious = FALSE
  FaultRequeueKeepsMode = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK QueueConsistent TagsConsistent NoLostWakeup ReturnConsistent
  SettleOnlyOnCancel RegistrationsSound BucketsHeldByHolders
