\* S3 RwLock: a reader, a writer and an upgrader that upgrades (SYR2, SYR4):
\* the upgrade waits only for the readers present and outranks the queued
\* writer; every waiter acquires (SYR7).
CONSTANTS
  Procs = {p1, p2, p3}
  Kind = "rwlock"
  Permits = 1
  Readers = {p1}
  Writers = {p2}
  Upgraders = {p3}
  Upgrading = {p3}
  Timed = {}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK SemBalance NoStrandedPermit ParkedBit MutualExclusion WordMatches
PROPERTY Acquires
