\* S3 RwLock with deadlines: the writer and the upgrader time out, the
\* upgrader then keeps upgradable mode (SYR4); the untimed reader acquires.
CONSTANTS
  Procs = {p1, p2, p3}
  Kind = "rwlock"
  Permits = 1
  Readers = {p1}
  Writers = {p2}
  Upgraders = {p3}
  Upgrading = {p3}
  Timed = {p2, p3}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK SemBalance NoStrandedPermit ParkedBit MutualExclusion WordMatches
PROPERTY Acquires
