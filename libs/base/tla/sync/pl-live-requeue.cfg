\* S1 liveness: requeue between two keys in two buckets, one waiter whose
\* parks carry a deadline and are interruptible, one waker.
CONSTANTS
  Procs = {p1, p2}
  Waiters = {p1}
  Wakers = {p2}
  Timed = {p1}
  Interruptible = {p1}
  NKeys = 2
  WaitKeys = {1}
  SharedBucket = FALSE
  EnableReset = TRUE
  EnableKick = FALSE
  EnableFilter = FALSE
  EnableRequeue = TRUE
  EnableFork = FALSE
  FaultValidateOutsideLock = FALSE
  FaultTimeoutIgnoresToken = FALSE
  FaultDeliverThroughRecord = FALSE
  FaultNoRetire = FALSE
  FaultSettleOnSpurious = FALSE
  FaultRequeueKeepsMode = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK QueueConsistent TagsConsistent NoLostWakeup ReturnConsistent
  SettleOnlyOnCancel RegistrationsSound BucketsHeldByHolders
PROPERTIES WakesReturn RegistrationsRetire SignalsComplete
