\* S3 Semaphore, one permit: three threads acquire, hold and release in a
\* loop, p3 with a deadline (SYS2-SYS4); every waiter without a deadline
\* acquires (SYS3: FIFO handoff).
CONSTANTS
  Procs = {p1, p2, p3}
  Kind = "semaphore"
  Permits = 1
  Readers = {}
  Writers = {}
  Upgraders = {}
  Upgrading = {}
  Timed = {p3}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK SemBalance NoStrandedPermit ParkedBit MutualExclusion WordMatches
PROPERTY Acquires
