\* S2 Mutex: three lockers and one fork (SYX1): a mutex held at the fork
\* stays held; otherwise stale parked and designated bits are reconciled
\* (SYP15) and every waiter in the child still acquires.
CONSTANTS
  Procs = {p1, p2, p3}
  Kind = "mutex"
  Lockers = {p1, p2, p3}
  CondWaiters = {}
  Notifiers = {}
  Timed = {}
  Interruptible = {}
  StarvationBound = 1
  EnableFork = TRUE
  EnableSpurious = FALSE
  FaultNoHandoff = FALSE
  FaultPureValidate = FALSE
  FaultNoPassOn = FALSE
  FaultTwoDesignated = FALSE
  FaultCancelBeatsGrant = FALSE
  FaultInterruptibleReacquire = FALSE
SPECIFICATION Spec
INVARIANTS
  MutualExclusion QueueConsistent Designation ParkedBit ConditionBit
  HandoffAtHead HandoffLockNeverFreeWithWaiters NoLostWakeup WaitReturn
  SettleOnce HeldStaysHeld
PROPERTIES AcquisitionsEnd DesignationsEnd DesignatedBitClears SelectedReturn
