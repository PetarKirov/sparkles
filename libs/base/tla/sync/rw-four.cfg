\* S3 RwLock, four threads: two readers, a writer with a deadline and an
\* upgrader that upgrades (SYR2-SYR7); every untimed waiter acquires.
CONSTANTS
  Procs = {p1, p2, p3, p4}
  Kind = "rwlock"
  Permits = 1
  Readers = {p1, p2}
  Writers = {p3}
  Upgraders = {p4}
  Upgrading = {p4}
  Timed = {p3}
  FaultRaiseCount = FALSE
  FaultTimeoutDrops = FALSE
  FaultReadersBarge = FALSE
  FaultNoDrainWake = FALSE
  FaultGrantOverUpgradable = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK SemBalance NoStrandedPermit ParkedBit MutualExclusion WordMatches
PROPERTY Acquires
